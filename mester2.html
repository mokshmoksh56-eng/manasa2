<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>اختيار المادة الدراسية - تصميم تركواز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D2C6;          
            --primary-hover: #00B5AA;    
            --secondary: #008B82;        
            --primary-light: #E0F9F8;    
            --primary-border: #A7EBE7;   
            
            --bg-color: #F2FDFD;         
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --danger: #EF4444;
            --warning: #F59E0B;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            padding: 40px 20px 60px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================================== */
        /* 📚 كارت اختيار المادة الذكي */
        /* ========================================================== */
        .subject-picker-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px -10px rgba(0, 210, 198, 0.15);
            position: relative;
            overflow: hidden;
        }

        .subject-picker-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
        }

        .subject-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border-light);
        }

        .subject-picker-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .subject-picker-title .picker-icon {
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 12px;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .subject-picker-badge {
            background: var(--primary-light);
            color: var(--secondary);
            font-size: 11px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            border: 1px solid var(--primary-border);
        }

        .subject-picker-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .subject-picker-body .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .subject-picker-body .form-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .subject-picker-body .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 700;
            color: var(--text-dark);
            background: #F8FAFC;
            transition: all 0.3s ease;
            outline: none;
        }

        .subject-picker-body .form-control:focus {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 210, 198, 0.15);
        }

        .subject-picker-body select.form-control {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300D2C6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 14px center;
            background-size: 16px;
            padding-left: 40px;
            appearance: none;
            cursor: pointer;
        }

        .subject-picker-body select.form-control:disabled {
            background-color: #F1F5F9;
            color: #94A3B8;
            cursor: not-allowed;
            opacity: 0.6;
            border-color: transparent;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
        }

        .subject-picker-chips {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .subject-picker-chips:empty {
            display: none;
        }

        .subject-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--secondary);
            font-size: 12.5px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 24px;
            border: 1px solid var(--primary-border);
            animation: chipAppear 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.2s ease;
        }
        
        .subject-chip:hover {
            background: var(--primary-border);
        }

        .subject-chip .chip-remove {
            cursor: pointer;
            font-size: 14px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        
        .subject-chip .chip-remove:hover {
            color: var(--white);
            background: var(--danger);
            transform: scale(1.1);
        }

        @keyframes chipAppear {
            from { opacity: 0; transform: scale(0.8) translateY(5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .subject-picker-hint {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-light);
            transition: color 0.3s ease;
        }

        /* ========================================================== */
        /* 💾 زر الحفظ */
        /* ========================================================== */
        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px -6px rgba(0, 210, 198, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px -6px rgba(0, 210, 198, 0.7);
        }
        .save-btn:active { 
            transform: translateY(0) scale(0.98); 
        }

        /* ========================================================== */
        /* ✅ شارة الحفظ التلقائي */
        /* ========================================================== */
        .autosave-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: #1E293B;
            color: var(--white);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            z-index: 9998;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }
        .autosave-bar.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .autosave-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ========================================================== */
        /* 📱 Responsive */
        /* ========================================================== */
        @media (max-width: 600px) {
            .subject-picker-body { grid-template-columns: 1fr; }
            .subject-picker-card { padding: 20px 16px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ✅ كارت اختيار المادة -->
        <div id="subjectPickerCard" class="subject-picker-card">
            <div class="subject-picker-header">
                <div class="subject-picker-title">
                    <span class="picker-icon">📚</span>
                    <span>ما هي المادة التي تدرسها؟</span>
                </div>
                <span class="subject-picker-badge">مرحلة واحدة فقط</span>
            </div>

            <div class="subject-picker-body">
                <div class="form-group">
                    <label>🎓 المرحلة الدراسية</label>
                    <select id="sp-stage" class="form-control">
                        <option value="">-- اختر المرحلة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>👑 الصف الدراسي</label>
                    <select id="sp-grade" class="form-control" disabled>
                        <option value="">-- اختر المرحلة أولاً --</option>
                    </select>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>📖 المواد (اضغط للاختيار المتعدد)</label>
                    <select id="sp-subject" class="form-control" disabled>
                        <option value="">-- اختر الصف أولاً --</option>
                    </select>
                </div>

                <div class="subject-picker-chips" id="subjectChips"></div>

                <div class="subject-picker-hint" id="picker-hint">
                    💡 قم باختيار المرحلة ثم الصف، ويمكنك إضافة أكثر من مادة لنفس المرحلة
                </div>
            </div>
        </div>

        <!-- ✅ زر الحفظ -->
        <button class="save-btn" onclick="window.saveSubjects()">
            <span>💾</span>
            <span>حفظ الإعدادات</span>
        </button>

    </div>

    <!-- ✅ شارة الحفظ التلقائي -->
    <div class="autosave-bar" id="autosave-bar">
        <span class="dot"></span>
        <span>تم الحفظ بنجاح</span>
    </div>

    <script>
        // ==========================================================
        // ✅ بيانات المناهج
        // ==========================================================
        const DEFAULT_CURRICULUM = {
            kg: {
                name: 'رياض الأطفال',
                icon: '🧸',
                grades: [
                    { name: 'KG1', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'متفرقات'] },
                    { name: 'KG2', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'متفرقات'] }
                ]
            },
            primary: {
                name: 'المرحلة الابتدائية',
                icon: '🎒',
                grades: [
                    { name: 'الصف الأول', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'متفرقات'] },
                    { name: 'الصف الثاني', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'متفرقات'] },
                    { name: 'الصف الثالث', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'متفرقات'] },
                    { name: 'الصف الرابع', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات', 'متفرقات'] },
                    { name: 'الصف الخامس', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات', 'متفرقات'] },
                    { name: 'الصف السادس', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات', 'متفرقات'] }
                ]
            },
            prep: {
                name: 'المرحلة الإعدادية',
                icon: '📐',
                grades: [
                    { name: 'الصف الأول الإعدادي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات'] },
                    { name: 'الصف الثاني الإعدادي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات'] },
                    { name: 'الصف الثالث الإعدادي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'علوم', 'دراسات'] }
                ]
            },
            secondary: {
                name: 'المرحلة الثانوية',
                icon: '🎓',
                grades: [
                    { name: 'الصف الأول الثانوي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'فيزياء', 'كيمياء', 'أحياء'] },
                    { name: 'الصف الثاني الثانوي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'فيزياء', 'كيمياء', 'أحياء'] },
                    { name: 'الصف الثالث الثانوي', subjects: ['لغة عربية', 'لغة إنجليزية', 'رياضيات', 'فيزياء', 'كيمياء', 'أحياء'] }
                ]
            }
        };

        let curriculum = DEFAULT_CURRICULUM;
        let selectedSubjects = [];

        function populateStagesDropdown() {
            const stageSel = document.getElementById('sp-stage');
            stageSel.innerHTML = '<option value="">-- اختر المرحلة --</option>';

            const knownOrder = ['kg', 'primary', 'prep', 'secondary'];
            const allIds = [];
            knownOrder.forEach(id => { if (curriculum[id]) allIds.push(id); });
            Object.keys(curriculum).forEach(id => {
                if (!knownOrder.includes(id) && curriculum[id]) allIds.push(id);
            });

            allIds.forEach(stageId => {
                const stage = curriculum[stageId];
                const opt = document.createElement('option');
                opt.value = stageId;
                opt.textContent = `${stage.icon || '📚'} ${stage.name}`;
                stageSel.appendChild(opt);
            });
        }

        function populateGradesDropdown(stageId) {
            const gradeSel = document.getElementById('sp-grade');
            gradeSel.innerHTML = '';
            gradeSel.disabled = true;

            if (!stageId || !curriculum[stageId]) {
                gradeSel.innerHTML = '<option value="">-- اختر المرحلة أولاً --</option>';
                return;
            }

            const stage = curriculum[stageId];
            const grades = stage.grades || [];

            if (grades.length === 0) {
                gradeSel.innerHTML = '<option value="">لا توجد صفوف</option>';
                return;
            }

            gradeSel.innerHTML = '<option value="">-- اختر الصف --</option>';
            grades.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.name;
                opt.textContent = `👑 ${g.name}`;
                gradeSel.appendChild(opt);
            });
            gradeSel.disabled = false;
        }

        function populateSubjectsDropdown(stageId, gradeName) {
            const subjectSel = document.getElementById('sp-subject');
            subjectSel.innerHTML = '';
            subjectSel.disabled = true;

            if (!stageId || !gradeName || !curriculum[stageId]) {
                subjectSel.innerHTML = '<option value="">-- اختر الصف أولاً --</option>';
                return;
            }

            const stage = curriculum[stageId];
            const grade = (stage.grades || []).find(g => g.name === gradeName);
            const subjects = grade ? (grade.subjects || []) : [];

            if (subjects.length === 0) {
                subjectSel.innerHTML = '<option value="">لا توجد مواد</option>';
                return;
            }

            subjectSel.innerHTML = '<option value="">-- اختر مادة --</option>';
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = `📖 ${s}`;
                subjectSel.appendChild(opt);
            });
            subjectSel.disabled = false;
        }

        function setupSubjectPickerEvents() {
            const stageSel = document.getElementById('sp-stage');
            const gradeSel = document.getElementById('sp-grade');
            const subjectSel = document.getElementById('sp-subject');

            stageSel.addEventListener('change', function() {
                populateGradesDropdown(this.value);
                populateSubjectsDropdown('', '');
            });

            gradeSel.addEventListener('change', function() {
                const stageId = stageSel.value;
                populateSubjectsDropdown(stageId, this.value);
            });

            subjectSel.addEventListener('change', function() {
                const stageId = stageSel.value;
                const gradeName = gradeSel.value;
                const subjectName = this.value;

                if (!stageId || !gradeName || !subjectName) return;

                const stage = curriculum[stageId];
                const stageName = stage ? stage.name : stageId;
                const stageIcon = stage ? (stage.icon || '📚') : '📚';

                const exists = selectedSubjects.some(s =>
                    s.stage === stageId &&
                    s.grade === gradeName &&
                    s.subject === subjectName
                );

                if (exists) {
                    showToast('⚠️ هذه المادة مضافة بالفعل');
                    this.value = '';
                    return;
                }

                selectedSubjects.push({
                    stage: stageId,
                    stageName: stageName,
                    stageIcon: stageIcon,
                    grade: gradeName,
                    subject: subjectName
                });

                renderSubjectChips();
                this.value = '';
                autoSaveSubjects();
            });
        }

        function renderSubjectChips() {
            const container = document.getElementById('subjectChips');
            container.innerHTML = '';

            const stageSel = document.getElementById('sp-stage');
            const hintText = document.getElementById('picker-hint');

            selectedSubjects.forEach((item, index) => {
                const chip = document.createElement('span');
                chip.className = 'subject-chip';
                chip.innerHTML = `
                    <span>${item.stageIcon} ${item.grade} • ${item.subject}</span>
                    <span class="chip-remove" onclick="window.removeSubjectChip(${index})" title="حذف">✖</span>
                `;
                container.appendChild(chip);
            });

            if (selectedSubjects.length > 0) {
                stageSel.disabled = true;
                hintText.innerHTML = '🔒 <b>تنبيه:</b> تم قفل المرحلة الدراسية. لتتمكن من تغيير المرحلة، يرجى حذف المواد المختارة أولاً.';
                hintText.style.color = 'var(--warning)';
            } else {
                stageSel.disabled = false;
                hintText.innerHTML = '💡 قم باختيار المرحلة ثم الصف، ويمكنك إضافة أكثر من مادة لنفس المرحلة';
                hintText.style.color = 'var(--text-muted)';
            }
        }

        window.removeSubjectChip = function(index) {
            selectedSubjects.splice(index, 1);
            renderSubjectChips();
            autoSaveSubjects();
        };

        function captureSubjects() {
            return selectedSubjects.map(s => ({
                stage: s.stage,
                grade: s.grade,
                subject: s.subject
            }));
        }

        function fillSubjects(subjects) {
            if (!Array.isArray(subjects)) return;
            selectedSubjects = subjects.map(s => {
                const stage = curriculum[s.stage];
                return {
                    stage: s.stage,
                    stageName: stage ? stage.name : s.stage,
                    stageIcon: stage ? (stage.icon || '📚') : '📚',
                    grade: s.grade,
                    subject: s.subject
                };
            });
            
            if (selectedSubjects.length > 0) {
                const stageSel = document.getElementById('sp-stage');
                if(stageSel.value !== selectedSubjects[0].stage) {
                     stageSel.value = selectedSubjects[0].stage;
                     populateGradesDropdown(selectedSubjects[0].stage);
                }
            }

            renderSubjectChips();
        }

        let autosaveTimer = null;

        function showAutosaveBar() {
            const bar = document.getElementById('autosave-bar');
            if (!bar) return;
            bar.classList.add('show');
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => bar.classList.remove('show'), 2000);
        }

        function autoSaveSubjects() {
            try {
                localStorage.setItem('schedule_subjects', JSON.stringify(captureSubjects()));
                showAutosaveBar();
            } catch(e) {}
        }

        // ==========================================================
        // 💾 تعديل زر الحفظ للرجوع إلى الصفحة الرئيسية
        // ==========================================================
        window.saveSubjects = function() {
            if (selectedSubjects.length === 0) {
                showToast('⚠️ يرجى اختيار مادة واحدة على الأقل قبل الحفظ');
                return;
            }

            localStorage.setItem('schedule_subjects', JSON.stringify(captureSubjects()));
            showAutosaveBar();
            console.log('✅ تم حفظ المواد:', selectedSubjects);

            // توجيه المستخدم لصفحة index2 بعد 300 جزء من الثانية
            setTimeout(() => {
                window.location.href = 'index2.html';
            }, 300);
        };

        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = `
                position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); opacity: 0;
                background: var(--danger); color: #fff; padding: 12px 24px; border-radius: 30px;
                font-size: 14px; font-weight: 800; z-index: 99999;
                box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
                transition: all 0.3s ease;
            `;
            document.body.appendChild(t);
            
            requestAnimationFrame(() => {
                t.style.transform = 'translateX(-50%) translateY(0)';
                t.style.opacity = '1';
            });

            setTimeout(() => {
                t.style.transform = 'translateX(-50%) translateY(-20px)';
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            populateStagesDropdown();
            setupSubjectPickerEvents();

            try {
                const savedSubjects = localStorage.getItem('schedule_subjects');
                if (savedSubjects) fillSubjects(JSON.parse(savedSubjects));
            } catch(e) {
                console.warn('فشل استرجاع المواد:', e);
            }

            window.addEventListener('beforeunload', () => {
                try {
                    localStorage.setItem('schedule_subjects', JSON.stringify(captureSubjects()));
                } catch(e) {}
            });
        });
    </script>

    <!-- 🔊 صوت ضغط تفاعلي -->
    <script>
    (function initClickSound() {
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }
        window.playClick = function(freq = 1800, duration = 0.035, volume = 0.08) {
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now); osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + duration);
            const gain = ctx.createGain(); gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.004); gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000; filter.Q.value = 0.7;
            osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + duration + 0.02);
        };
        function attachClickSound() {
            document.querySelectorAll('.save-btn, select, .chip-remove').forEach(el => {
                if (el.dataset.soundAttached === '1') return;
                el.dataset.soundAttached = '1';
                el.addEventListener('click', () => {
                    if (el.disabled) return;
                    if (el.classList.contains('save-btn')) window.playClick(1400, 0.06, 0.13);
                    else if (el.classList.contains('chip-remove')) window.playClick(1200, 0.05, 0.11);
                    else window.playClick(1800, 0.035, 0.08);
                }, { passive: true });
            });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachClickSound);
        else attachClickSound();
        const observer = new MutationObserver(() => {
            clearTimeout(window._soundAttachTimer); window._soundAttachTimer = setTimeout(attachClickSound, 100);
        });
        observer.observe(document.body, { childList: true, subtree: true });
        document.addEventListener('touchstart', () => getCtx(), { once: true, passive: true });
        document.addEventListener('click', () => getCtx(), { once: true, passive: true });
    })();
    </script>
