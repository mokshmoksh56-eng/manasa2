        /* ============================================ */
        .saved-sections-wrapper {يرجع عدم تحديث الموقع الحالي وتسجيل الموقع القديم في ملف `talep.html` إلى ثلاثة أسباب برمجية رئيسية في كود الخريطة[span_4](start_span)[span_4](end_span):

1. **استبدال موقع الـ GPS الحقيقي بموقع المعلم المسجل (`autoCenterOnTeacher`):** داخل دالة `buildRadarMap`، يتم تمرير القيمة `true` لمتغير `autoCenterOnTeacher`، مما يجعل الكود يلغي إحداثيات الـ GPS الحالية الخاصة بك ويستبدلها بإحداثيات المعلم المحفوظة مسبقاً في الذاكرة (`registeredList[0]`) إذا كانت المسافة أكبر من نطاق البحث[span_5](start_span)[span_5](end_span).
2. **عدم منع قراءة الموقع المخزن في الكاش (`maximumAge: 0`):** إعدادات `getCurrentPosition` الحالية لا تحتوي على `maximumAge: 0`، مما يسمح للمتصفح أو الهاتف بإرجاع آخر موقع قديم مسجل في الذاكرة المؤقتة بدلاً من سحب قراءة حية جديدة من القمر الصناعي[span_6](start_span)[span_6](end_span).
3. **قِصر مهلة البحث (`timeout: 5000`) والانتقال الصامت للموقع القديم عند الفشل:** مهلة الـ 5 ثوانٍ مع تفعيل الدقة العالية (`enableHighAccuracy: true`) غير كافية لالتقاط إشارة GPS جديدة في كثير من الهواتف، فيدخل الكود في دالة الخطأ (`error`) التي تعرض موقع المعلم القديم أو الموقع الافتراضي (`31.0409, 31.3785`) دون إظهار أي تنبيه بأن الـ GPS لم يلتقط الإشارة[span_7](start_span)[span_7](end_span).

### 🛠️ التعديل المطلوب (الجزء الخاص بالـ GPS فقط)

يمكنك استبدال دالتي `startSmartSearch` و `buildRadarMap` في نهاية الملف بالكود التالي لضمان سحب الموقع الحالي الحقيقي في كل مرة وعدم القفز للموقع القديم:

```javascript
        function startSmartSearch() {
            const subject = document.getElementById('s_subject').value;
            if(!subject) { showToast("يرجى استكمال البيانات (المرحلة، الصف، المادة) أولاً!", true); return; }

            const btn = document.getElementById('searchBtn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = "⏳ جاري جلب موقعك الحالي بدقة..."; 
            btn.classList.add('loading');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => { 
                        btn.innerHTML = originalBtnHTML; 
                        btn.classList.remove('loading'); 
                        // تمرير false لمنع الكود من إلغاء موقعك الحالي والذهاب لموقع المعلم القديم
                        buildRadarMap(position.coords.latitude, position.coords.longitude, false); 
                        showToast("تم تحديث موقعك الحالي بالـ GPS بنجاح 📍");
                    },
                    (error) => { 
                        btn.innerHTML = originalBtnHTML; 
                        btn.classList.remove('loading'); 
                        let errMsg = "تعذر جلب الموقع الحالي، تأكد من تفعيل الـ GPS في هاتفك!";
                        if (error.code === 1) errMsg = "يرجى السماح للمتصفح بالوصول إلى الموقع الجغرافي (GPS)!";
                        else if (error.code === 3) errMsg = "انتهت مهلة التقاط إشارة الـ GPS، حاول مرة أخرى في مكان مفتوح!";
                        showToast(errMsg, true);
                    },
                    { 
                        enableHighAccuracy: true, 
                        timeout: 15000,      // 15 ثانية لإعطاء الهاتف وقتاً كافياً لالتقاط الموقع الجديد
                        maximumAge: 0        // إجبار المتصفح على جلب موقع جديد وعدم استخدام الموقع القديم نهائياً
                    }
                );
            } else { 
                btn.innerHTML = originalBtnHTML; 
                btn.classList.remove('loading'); 
                showToast("متصفحك لا يدعم خاصية تحديد المواقع (GPS)!", true);
            }
        }

        function buildRadarMap(lat, lng, autoCenterOnTeacher = false) {
            document.getElementById('mapOuterWrapper').style.display = 'block';
            initMap();
            if (studentMarker) map.removeLayer(studentMarker);
            if (searchCircle) map.removeLayer(searchCircle);
            teachersLayer.clearLayers();

            const searchRadius = parseInt(document.getElementById('search_radius').value);
            
            // تثبيت المركز على الإحداثيات الحقيقية الممررة مباشرة دون استبدالها بالموقع القديم
            currentCenter = [lat, lng];
            map.setView(currentCenter, 15);

            searchCircle = L.circle(currentCenter, { color: '#10B981', weight: 2, dashArray: '8, 8', fillColor: '#34D399', fillOpacity: 0.15 }).addTo(map);
            searchCircle.setRadius(searchRadius);

            const studentIcon = L.divIcon({ className: 'custom-student-marker', html: '<div class="student-radar"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
            studentMarker = L.marker(currentCenter, { icon: studentIcon, draggable: true, zIndexOffset: 10000 }).addTo(map);

            studentMarker.on('drag', function(e) { searchCircle.setLatLng(e.target.getLatLng()); });
            studentMarker.on('dragend', function(e) {
                currentCenter = [e.target.getLatLng().lat, e.target.getLatLng().lng];
                renderRegisteredTeachersFromEnd(currentCenter, parseInt(document.getElementById('search_radius').value));
            });

            renderRegisteredTeachersFromEnd(currentCenter, searchRadius);
            setTimeout(() => { 
                map.fitBounds(searchCircle.getBounds(), { padding: [20, 20], maxZoom: 16 }); 
                document.getElementById('mapOuterWrapper').scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            }, 300);
        }
