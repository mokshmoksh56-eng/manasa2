<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الطالب - منصة احجزلى</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { overscroll-behavior-x: none; touch-action: pan-y; }
        body { background: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; margin: 0; }

        /* ============================================ */
        /* ✅ الهيدر */
        /* ============================================ */
        .hero-banner {
            position: relative; width: 100%; min-height: 250px;
            background-image: url('./teacher2.png'); background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px;
        }
        .hero-banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.95) 100%); z-index: 1;
        }
        .hero-content { position: relative; z-index: 3; text-align: center; max-width: 700px; width: 100%; }
        .hero-brand { font-size: 36px; font-weight: 900; color: #0F172A; margin-bottom: 5px; }
        .hero-brand .accent { color: #10B981; }
        .hero-headline { font-size: 22px; font-weight: 900; color: #1E293B; margin-top: 10px; }

        /* ============================================ */
        /* ✅ محتوى الصفحة والبطاقات */
        /* ============================================ */
        .main-container { max-width: 800px; margin: -30px auto 0; width: 100%; padding: 0 15px 80px; position: relative; z-index: 10; }
        
        .smart-card {
            background: #fff; border: 1.5px solid #E2E8F0; 
            border-top: 5px solid #10B981; border-bottom: 6px solid #334155; 
            border-radius: 16px; padding: 20px; box-shadow: 0 6px 15px -5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .section-title { color: #0F2D5C; font-weight: 900; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-size: 18px; border-bottom: 2px dashed #E2E8F0; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 900; color: #1E293B; margin-bottom: 6px; }
        
        .form-control {
            width: 100%; padding: 12px; border: 1.5px solid #CBD5E1; 
            border-bottom: 4px solid #334155; border-radius: 10px; font-size: 14px; color: #1E293B;
            font-weight: 900; transition: all 0.3s; outline: none; background: #FFFFFF;
        }
        .form-control:focus { border-color: #10B981; border-bottom: 4px solid #059669; background: #F8FAFC; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .radio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        .radio-grid input { display: none; }
        .radio-grid label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 5px; border: 1.5px solid #CBD5E1; border-bottom: 4px solid #334155; 
            border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 900; 
            transition: all 0.2s; text-align: center; background: #FFFFFF; color: #1E293B;
        }
        .radio-grid label i { font-size: 24px; font-style: normal; margin-bottom: 5px; }
        .radio-grid input:checked + label {
            border-color: #10B981; border-bottom-color: #059669; background: #D1FAE5; color: #065F46; 
            transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; 
        }

        /* ✅ شريط تمرير النطاق (Slider) */
        .styled-slider {
            -webkit-appearance: none; width: 100%; height: 8px; border-radius: 5px;
            background: #E2E8F0; outline: none; transition: background 0.2s;
            margin-top: 5px; margin-bottom: 5px;
        }
        .styled-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 26px; height: 26px; border-radius: 50%;
            background: #10B981; cursor: pointer;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); border: 3px solid #fff;
            transition: transform 0.1s;
        }
        .styled-slider::-webkit-slider-thumb:active { transform: scale(1.2); }
        .styled-slider::-moz-range-thumb {
            width: 26px; height: 26px; border-radius: 50%;
            background: #10B981; cursor: pointer;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); border: 3px solid #fff;
        }

        .btn-search {
            width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 900;
            display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: all 0.3s;
            background: linear-gradient(135deg, #10B981, #059669); color: #fff; border: 1px solid #065F46; border-bottom: 4px solid #064E3B;
            margin-top: 20px;
        }
        .btn-search:active { transform: translateY(2px); border-bottom-width: 2px; }
        .btn-search.loading { background: linear-gradient(135deg, #F59E0B, #D97706); border-color: #B45309; pointer-events: none; animation: pulse-btn 1.5s infinite;}
        
        @keyframes pulse-btn { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* ============================================ */
        /* ✅ إبداع الخريطة (الرادار التفاعلي) */
        /* ============================================ */
        .map-hint { background: #DBEAFE; color: #1E40AF; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 800; text-align: center; margin-bottom: 10px; display: none; border: 1px dashed #93C5FD; }
        .map-container { position: relative; width: 100%; border-radius: 16px; border: 2px solid #CBD5E1; border-bottom: 6px solid #334155; overflow: hidden; z-index: 1; transition: all 0.5s; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #map { width: 100%; height: 380px; }

        .student-radar {
            position: relative; width: 22px; height: 22px;
            background-color: #3B82F6; border-radius: 50%;
            border: 3px solid white; cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .student-radar:active { cursor: grabbing; transform: scale(1.1); }
        .student-radar::after {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%; border: 2px solid #3B82F6;
            animation: radar-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
            pointer-events: none;
        }
        @keyframes radar-ping { 75%, 100% { transform: scale(2.5); opacity: 0; } }

        .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-bottom: 4px solid #0F2D5C;}
        .leaflet-popup-content { font-family: 'Cairo', sans-serif; text-align: center; line-height: 1.6; font-size: 13px; margin: 15px;}
        .teacher-popup-title { font-weight: 900; color: #0F2D5C; font-size: 16px; margin-bottom: 8px; border-bottom: 2px dashed #E2E8F0; padding-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;}
        .teacher-popup-detail { display: flex; justify-content: space-between; font-weight: 800; color: #475569; font-size: 12px; margin-bottom: 6px; background: #F8FAFC; padding: 4px 8px; border-radius: 6px;}
        .teacher-popup-btn { background: linear-gradient(135deg, #F59E0B, #D97706); color: white; padding: 8px 15px; border-radius: 10px; border-bottom: 3px solid #92400E; cursor: pointer; font-weight: 900; margin-top: 12px; width: 100%; display: block; border-top: none; border-left: none; border-right: none; transition: all 0.2s;}
        .teacher-popup-btn:active { transform: translateY(2px); border-bottom-width: 1px; }

        path.leaflet-interactive { animation: breathe 3s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { fill-opacity: 0.1; } 50% { fill-opacity: 0.25; } }

        @media (max-width: 480px) {
            .hero-banner { min-height: 200px; padding: 15px 10px; }
            .hero-brand { font-size: 26px; }
            .hero-headline { font-size: 16px; margin-top: 5px; }
            .grid-2 { grid-template-columns: 1fr; gap: 10px; }
            .radio-grid label { padding: 10px 2px; font-size: 12px; }
            #map { height: 340px; }
        }
    </style>
</head>
<body>

    <section class="hero-banner">
        <div class="hero-content">
            <div class="hero-brand">مرحباً بك <span class="accent">يا بطل! 🎓</span></div>
            <div class="hero-headline">ابحث عن أفضل المدرسين وابدأ رحلة التفوق</div>
        </div>
    </section>

    <div class="main-container">
        <!-- 1. بيانات الطالب -->
        <div class="smart-card">
            <h3 class="section-title"><span>👤</span> بياناتك الشخصية</h3>
            <div class="form-group">
                <label>هل أنت؟</label>
                <div class="radio-grid">
                    <div><input type="radio" name="st_gender" id="st_boy" value="ولد" checked><label for="st_boy"><i>👨‍🎓</i> ولد</label></div>
                    <div><input type="radio" name="st_gender" id="st_girl" value="بنت"><label for="st_girl"><i>👩‍🎓</i> بنت</label></div>
                </div>
            </div>
            <div class="form-group">
                <label>اسمك بالكامل</label>
                <input type="text" id="st_name" class="form-control" placeholder="اكتب اسمك هنا...">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>عمرك (بالسنوات)</label>
                    <input type="number" id="st_age" class="form-control" placeholder="مثال: 14" oninput="checkAge()">
                </div>
                <div class="form-group">
                    <label id="phone_label" style="color:#0F2D5C;">📱 رقم الواتس أب</label>
                    <input type="tel" id="st_phone" class="form-control" placeholder="010XXXXXXXX">
                </div>
            </div>
        </div>

        <!-- 2. المرحلة الدراسية -->
        <div class="smart-card" style="border-top-color: #3B82F6;">
            <h3 class="section-title"><span>📚</span> دراستك والمادة</h3>
            <div class="form-group">
                <label>المرحلة الدراسية</label>
                <select id="s_stage" class="form-control" onchange="updateGrades()">
                    <option value="">-- اختر المرحلة --</option>
                    <option value="primary">🎒 الابتدائية</option>
                    <option value="prep">📐 الإعدادية</option>
                    <option value="secondary">🎓 الثانوية</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>الصف الدراسي</label>
                    <select id="s_grade" class="form-control" disabled onchange="updateSubjects()">
                        <option value="">-- اختر المرحلة أولاً --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المادة التي تبحث عنها</label>
                    <select id="s_subject" class="form-control" disabled>
                        <option value="">-- اختر الصف أولاً --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. تفضيلات الدرس والبحث -->
        <div class="smart-card" style="border-top-color: #F59E0B;">
            <h3 class="section-title"><span>🔍</span> تفضيلات الدرس</h3>
            <div class="form-group">
                <label>تفضل الدرس مع؟</label>
                <div class="radio-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div><input type="radio" name="pref_teacher" id="t_mr" value="مستر"><label for="t_mr"><i>👨‍🏫</i> مستر</label></div>
                    <div><input type="radio" name="pref_teacher" id="t_ms" value="مس"><label for="t_ms"><i>👩‍🏫</i> مس</label></div>
                    <div><input type="radio" name="pref_teacher" id="t_any" value="أي منهما" checked><label for="t_any"><i>🤷‍♂️</i> أي منهما</label></div>
                </div>
            </div>
            <div class="form-group">
                <label>أين تفضل أخذ الدرس؟</label>
                <div class="radio-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div><input type="radio" name="pref_loc" id="l_center" value="السنتر" checked><label for="l_center"><i>🏫</i> السنتر</label></div>
                    <div><input type="radio" name="pref_loc" id="l_teacher" value="بيت المستر"><label for="l_teacher"><i>🏠</i> بيت المستر/المس</label></div>
                    <div><input type="radio" name="pref_loc" id="l_home" value="في منزلي"><label for="l_home"><i>🚗</i> منزلي (يجيني)</label></div>
                </div>
            </div>

            <!-- شريط اختيار نطاق البحث التفاعلي -->
            <div class="form-group" style="margin-top: 25px; padding: 15px; background: #F8FAFC; border-radius: 12px; border: 1.5px solid #E2E8F0;">
                <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 15px;">🎯 نطاق البحث المسموح:</span>
                    <span id="radius_val_display" style="color: #10B981; font-weight: 900; font-size: 16px; background: #D1FAE5; padding: 4px 12px; border-radius: 20px;">3 كيلومتر</span>
                </label>
                
                <input type="range" id="search_radius" min="500" max="5000" step="100" value="3000" class="styled-slider clickable-element" oninput="updateRadiusDisplay()" onchange="onRadiusChangeEnd()">
                
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #64748B; margin-top: 8px; font-weight: 800;">
                    <span>500 متر</span>
                    <span>5 كيلو</span>
                </div>
            </div>

            <button class="btn-search clickable-element" id="searchBtn" onclick="startSmartSearch()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 22px; height: 22px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
                تحديد موقعي والبحث في النطاق الدائري
            </button>
            
            <div id="mapHint" class="map-hint" style="margin-top: 20px;">
                💡 يمكنك سحب النقطة الزرقاء لتغيير مركز البحث واستكشاف أماكن أخرى
            </div>
            
            <div class="map-container" id="mapWrapper" style="display: none; margin-top: 0;">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. المتغيرات العامة للخريطة
        // ==========================================
        let map = null;
        let teachersLayer = null; 
        let studentMarker = null; 
        let searchCircle = null;  
        let currentCenter = null; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHighPitchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(2500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); 
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('.clickable-element, label, select, input[type="radio"]')) playHighPitchSound();
        });

        // ==========================================
        // 1. منطق العمر والمناهج
        // ==========================================
        function checkAge() {
            const ageInput = document.getElementById('st_age').value;
            const phoneLabel = document.getElementById('phone_label');
            const phoneInput = document.getElementById('st_phone');
            if (ageInput !== "" && parseInt(ageInput) < 13) {
                phoneLabel.innerHTML = "📱 رقم ولي الأمر <span style='color:#EF4444; font-size:11px;'>(لأنك أقل من 13 سنة)</span>";
                phoneInput.placeholder = "أدخل رقم ولي الأمر...";
            } else {
                phoneLabel.innerHTML = "📱 رقم الواتس أب الخاص بك";
                phoneInput.placeholder = "010XXXXXXXX";
            }
        }

        const curriculum = {
            primary: { grades: ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس'], subjs: ['عربي', 'إنجليزي', 'رياضيات', 'علوم'] },
            prep: { grades: ['الأول الإعدادي', 'الثاني الإعدادي', 'الثالث الإعدادي'], subjs: ['عربي', 'إنجليزي', 'رياضيات', 'علوم', 'دراسات'] },
            secondary: { grades: ['الأول الثانوي', 'الثاني الثانوي', 'الثالث الثانوي'], subjs: ['فيزياء', 'كيمياء', 'أحياء', 'رياضيات'] }
        };

        function updateGrades() {
            const stage = document.getElementById('s_stage').value;
            const gSelect = document.getElementById('s_grade');
            const sSelect = document.getElementById('s_subject');
            gSelect.innerHTML = '<option value="">-- اختر الصف --</option>';
            sSelect.innerHTML = '<option value="">-- اختر المادة --</option>';
            sSelect.disabled = true;
            if(stage) { curriculum[stage].grades.forEach(g => gSelect.innerHTML += `<option value="${g}">${g}</option>`); gSelect.disabled = false; } else { gSelect.disabled = true; }
        }

        function updateSubjects() {
            const stage = document.getElementById('s_stage').value;
            const sSelect = document.getElementById('s_subject');
            sSelect.innerHTML = '<option value="">-- اختر مادة --</option>';
            if(stage && document.getElementById('s_grade').value) { curriculum[stage].subjs.forEach(s => sSelect.innerHTML += `<option value="${s}">${s}</option>`); sSelect.disabled = false; } else { sSelect.disabled = true; }
        }

        // ==========================================
        // 2. تحديث مؤشر النطاق (التفاعلي)
        // ==========================================
        function updateRadiusDisplay() {
            const val = document.getElementById('search_radius').value;
            const display = document.getElementById('radius_val_display');
            if (val < 1000) {
                display.innerText = val + " متر";
            } else {
                let kmVal = (val / 1000).toFixed(1);
                if(kmVal.endsWith('.0')) kmVal = kmVal.slice(0, -2);
                display.innerText = kmVal + " كيلومتر";
            }
            saveStudentData();

            if (searchCircle) {
                searchCircle.setRadius(val);
            }
        }

        function onRadiusChangeEnd() {
            if (currentCenter && searchCircle) {
                const radius = parseInt(document.getElementById('search_radius').value);
                generateSmartTeachers(currentCenter, radius);
                map.fitBounds(searchCircle.getBounds(), { padding: [20, 20], maxZoom: 16 });
            }
        }

        // ==========================================
        // 3. التخزين الداخلي (Local Storage)
        // ==========================================
        function saveStudentData() {
            const studentData = {
                st_gender: document.querySelector('input[name="st_gender"]:checked')?.id,
                st_name: document.getElementById('st_name').value,
                st_age: document.getElementById('st_age').value,
                st_phone: document.getElementById('st_phone').value,
                s_stage: document.getElementById('s_stage').value,
                s_grade: document.getElementById('s_grade').value,
                s_subject: document.getElementById('s_subject').value,
                pref_teacher: document.querySelector('input[name="pref_teacher"]:checked')?.id,
                pref_loc: document.querySelector('input[name="pref_loc"]:checked')?.id,
                search_radius: document.getElementById('search_radius').value
            };
            localStorage.setItem('talep_data', JSON.stringify(studentData));
        }

        function loadStudentData() {
            const savedData = localStorage.getItem('talep_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                if (data.st_gender) document.getElementById(data.st_gender).checked = true;
                if (data.st_name) document.getElementById('st_name').value = data.st_name;
                if (data.st_age) { document.getElementById('st_age').value = data.st_age; checkAge(); }
                if (data.st_phone) document.getElementById('st_phone').value = data.st_phone;
                if (data.s_stage) { document.getElementById('s_stage').value = data.s_stage; updateGrades(); }
                if (data.s_grade) { document.getElementById('s_grade').value = data.s_grade; updateSubjects(); }
                if (data.s_subject) { document.getElementById('s_subject').value = data.s_subject; }
                if (data.pref_teacher) document.getElementById(data.pref_teacher).checked = true;
                if (data.pref_loc) document.getElementById(data.pref_loc).checked = true;
                
                if (data.search_radius) { 
                    document.getElementById('search_radius').value = data.search_radius; 
                    updateRadiusDisplay(); 
                }
            }
        }

        window.onload = () => {
            loadStudentData();
            document.querySelectorAll('input, select').forEach(el => {
                if(el.id !== 'search_radius') { 
                    el.addEventListener('input', saveStudentData);
                    el.addEventListener('change', saveStudentData);
                }
            });
        };

        // ==========================================
        // 4. منطق الخريطة الذكية والرادار القابل للسحب (محدث)
        // ==========================================
        function initMap() {
            if (!map) {
                map = L.map('map', { zoomControl: false });
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                teachersLayer = L.layerGroup().addTo(map);
            }
            map.invalidateSize();
        }

        function startSmartSearch() {
            const stage = document.getElementById('s_stage').value;
            const grade = document.getElementById('s_grade').value;
            const subject = document.getElementById('s_subject').value;

            if(!stage || !grade || !subject) {
                alert("يرجى اختيار المرحلة، الصف، والمادة أولاً لنتمكن من البحث في محيطك.");
                return;
            }

            const btn = document.getElementById('searchBtn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = "⏳ جاري تحديد موقعك والبحث...";
            btn.classList.add('loading');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => buildRadarMap(position.coords.latitude, position.coords.longitude, originalBtnHTML),
                    (error) => {
                        buildRadarMap(31.0409, 31.3785, originalBtnHTML);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                buildRadarMap(31.0409, 31.3785, originalBtnHTML);
            }
        }

        function buildRadarMap(lat, lng, originalBtnHTML) {
            const btn = document.getElementById('searchBtn');
            btn.innerHTML = originalBtnHTML;
            btn.classList.remove('loading');

            const mapWrap = document.getElementById('mapWrapper');
            const mapHint = document.getElementById('mapHint');
            mapWrap.style.display = 'block';
            mapHint.style.display = 'block';
            
            initMap();
            
            if (studentMarker) map.removeLayer(studentMarker);
            if (searchCircle) map.removeLayer(searchCircle);
            teachersLayer.clearLayers();
            
            currentCenter = [lat, lng];
            map.setView(currentCenter, 14);

            const searchRadius = parseInt(document.getElementById('search_radius').value); 
            
            searchCircle = L.circle(currentCenter, {
                color: '#10B981', weight: 3, dashArray: '10, 10', fillColor: '#34D399', fillOpacity: 0.15
            }).addTo(map);
            searchCircle.setRadius(searchRadius);

            const studentIcon = L.divIcon({
                className: 'custom-student-marker',
                html: '<div class="student-radar"></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
            
            // ✅ تم إضافة zIndexOffset بقيمة 10000 لضمان بقاء النقطة دائماً فوق أيقونات المدرسين
            studentMarker = L.marker(currentCenter, { 
                icon: studentIcon, 
                draggable: true,
                zIndexOffset: 10000 
            }).addTo(map);

            studentMarker.on('drag', function(e) {
                searchCircle.setLatLng(e.target.getLatLng());
            });

            studentMarker.on('dragend', function(e) {
                currentCenter = [e.target.getLatLng().lat, e.target.getLatLng().lng];
                const radius = parseInt(document.getElementById('search_radius').value);
                generateSmartTeachers(currentCenter, radius);
            });

            generateSmartTeachers(currentCenter, searchRadius);

            setTimeout(() => {
                map.fitBounds(searchCircle.getBounds(), { padding: [20, 20], maxZoom: 16 });
                mapWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        function generateSmartTeachers(centerPos, radiusInMeters) {
            teachersLayer.clearLayers();

            const subject = document.getElementById('s_subject').value;
            const grade = document.getElementById('s_grade').value;
            const prefTeacher = document.querySelector('input[name="pref_teacher"]:checked').value;
            const prefLoc = document.querySelector('input[name="pref_loc"]:checked').value;

            const degreeRadius = radiusInMeters / 111000;

            const namesMr = ["أ/ محمد أحمد", "أ/ محمود طارق", "أ/ علي حسن", "أ/ إبراهيم سعيد", "أ/ مصطفى كمال"];
            const namesMs = ["أ/ سارة محمود", "أ/ فاطمة علي", "أ/ ندى مصطفى", "أ/ منة طارق", "أ/ ياسمين عادل"];
            
            let pool = [];
            if (prefTeacher === "مستر") pool = namesMr.map(n => ({name: n, gender: "مستر"}));
            else if (prefTeacher === "مس") pool = namesMs.map(n => ({name: n, gender: "مس"}));
            else {
                pool = [...namesMr.map(n => ({name: n, gender: "مستر"})), ...namesMs.map(n => ({name: n, gender: "مس"}))];
            }

            let maxTeachers = radiusInMeters < 1500 ? 2 : (radiusInMeters < 3000 ? 4 : 6);
            pool = pool.sort(() => 0.5 - Math.random()).slice(0, Math.floor(Math.random() * 2) + maxTeachers);

            pool.forEach(t => {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * degreeRadius; 
                const tLat = centerPos[0] + (r * Math.cos(angle));
                const tLng = centerPos[1] + (r * Math.sin(angle));

                const iconEmoji = t.gender === 'مستر' ? '👨‍🏫' : '👩‍🏫';
                const iconColor = t.gender === 'مستر' ? '#0284C7' : '#DB2777';

                const iconHtml = `<div style="background-color: ${iconColor}; color: white; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 3px solid white; font-size: 18px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); transition: transform 0.2s;">
                    ${iconEmoji}
                </div>`;

                const customIcon = L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: iconHtml,
                    iconSize: [38, 38],
                    iconAnchor: [19, 19],
                    popupAnchor: [0, -15]
                });

                const popupContent = `
                    <div class="teacher-popup-title">${iconEmoji} ${t.name}</div>
                    <div class="teacher-popup-detail"><span>📚 المادة:</span> <span>${subject} (${grade})</span></div>
                    <div class="teacher-popup-detail"><span>📍 المكان:</span> <span style="color:#059669;">${prefLoc === 'في منزلي' ? 'مستعد للحضور لمنزلك' : prefLoc}</span></div>
                    <div class="teacher-popup-detail"><span>⭐ التقييم:</span> <span style="color:#F59E0B;">4.9 / 5</span></div>
                    <button class="teacher-popup-btn clickable-element" onclick="bookLesson('${t.name}')">تأكيد حجز الدرس</button>
                `;

                const marker = L.marker([tLat, tLng], { icon: customIcon });
                marker.bindPopup(popupContent);
                teachersLayer.addLayer(marker); 
            });
        }

        function bookLesson(teacherName) {
            playHighPitchSound();
            alert(`تم حجز الدرس المبدئي مع ${teacherName}. سيتم التواصل معك لتأكيد الموعد.`);
        }
    </script>
</body>
</html>
