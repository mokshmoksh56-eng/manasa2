<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعدادات الحصة - منصة احجزلى</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .edit-alert {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #fff; text-align: center; padding: 12px 15px; font-size: 15px; font-weight: 800;
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .hero-banner {
            position: relative; width: 100%; min-height: 250px;
            background-image: url('./teacher2.png'); background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px;
        }
        .hero-banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.95) 100%); z-index: 1;
        }
        .hero-content { position: relative; z-index: 3; text-align: center; max-width: 700px; width: 100%; }
        .hero-brand { font-size: 36px; font-weight: 900; color: #0F172A; margin-bottom: 5px; }
        .hero-brand .accent { color: #F59E0B; }
        .hero-headline { font-size: 22px; font-weight: 900; color: #1E293B; margin-top: 10px; }

        .wizard-progress {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 500px; margin: -30px auto 20px; position: relative; z-index: 10;
            background: #fff; padding: 15px 25px; border-radius: 99px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .step-indicator {
            display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; z-index: 2;
        }
        .step-dot {
            width: 35px; height: 35px; border-radius: 50%; background: #E2E8F0; color: #64748B;
            display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px;
            transition: all 0.4s ease;
        }
        .step-indicator.active .step-dot { background: #0F2D5C; color: #fff; transform: scale(1.1); box-shadow: 0 5px 15px rgba(15, 45, 92, 0.3); }
        .step-indicator.completed .step-dot { background: #10B981; color: #fff; }
        .step-label { font-size: 11px; font-weight: 800; color: #64748B; }
        .step-indicator.active .step-label { color: #0F2D5C; }
        .progress-line {
            position: absolute; top: 32px; left: 40px; right: 40px; height: 3px; background: #E2E8F0; z-index: 1;
        }
        .progress-line-fill {
            height: 100%; background: #10B981; width: 0%; transition: width 0.4s ease;
        }

        .step-content { display: none; max-width: 800px; margin: 0 auto; width: 100%; padding: 0 15px 40px; animation: fadeIn 0.4s ease; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .theme-pink { --c-main: #FF6B6B; --c-dark: #E03131; --c-light: #FFF5F5; --c-border: #FFC9C9; }
        .theme-turq { --c-main: #00D2C6; --c-dark: #008B82; --c-light: #F2FDFD; --c-border: #A7EBE7; }
        .theme-teal { --c-main: #25968b; --c-dark: #1b736a; --c-light: #e0f2f0; --c-border: #b2dfdb; }

        .smart-card {
            background: #fff; border: 2px solid var(--c-border); border-top: 5px solid var(--c-main);
            border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 10px; font-size: 14px;
            font-weight: 700; transition: all 0.3s; outline: none; background: #F8FAFC;
        }
        .form-control:focus { border-color: var(--c-main); background: #fff; box-shadow: 0 0 0 3px var(--c-light); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .radio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .radio-grid input { display: none; }
        .radio-grid label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px 5px; border: 2px solid #E2E8F0; border-radius: 12px; cursor: pointer;
            font-size: 12px; font-weight: 800; transition: all 0.2s; text-align: center;
        }
        .radio-grid label i { font-size: 24px; font-style: normal; margin-bottom: 5px; }
        .radio-grid input:checked + label {
            border-color: var(--c-main); background: var(--c-light); color: var(--c-dark); transform: translateY(-3px);
        }

        .days-grid, .months-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .days-grid input, .months-grid input { display: none; }
        .days-grid label, .months-grid label {
            display: flex; align-items: center; justify-content: center;
            padding: 10px; border: 2px solid #E2E8F0; border-radius: 10px; cursor: pointer;
            font-size: 12px; font-weight: 800; transition: all 0.2s; background: #F8FAFC; color: #475569;
        }
        .days-grid input:checked + label, .months-grid input:checked + label {
            border-color: var(--c-main); background: var(--c-light); color: var(--c-dark); font-weight: 900;
            border-width: 2px;
        }

        .subject-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip {
            background: var(--c-light); color: var(--c-dark); padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 800; border: 1px solid var(--c-border); display: flex; align-items: center; gap: 8px;
        }
        .chip span { cursor: pointer; color: #EF4444; }

        .map-container { position: relative; width: 100%; border-radius: 12px; border: 2px solid var(--c-border); overflow: hidden; z-index: 1; }
        #map { width: 100%; height: 260px; }
        
        .locate-btn {
            position: absolute; bottom: 15px; left: 15px; z-index: 400;
            background: #fff; border: 2px solid #25968b; border-radius: 12px;
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); color: #1b736a;
            transition: all 0.2s;
        }
        .locate-btn:hover { background: #e0f2f0; transform: scale(1.05); }

        .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-next, .btn-prev {
            flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900;
            display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-next { background: linear-gradient(135deg, var(--c-main), var(--c-dark)); color: #fff; }
        .btn-prev { background: #E2E8F0; color: #475569; flex: 0.4; }
        .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .btn-prev:hover { background: #CBD5E1; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .success-modal {
            background: #fff; width: 90%; max-width: 350px;
            border-radius: 24px; padding: 30px 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .success-modal { transform: translateY(0) scale(1); }

        .success-icon {
            width: 70px; height: 70px; margin: 0 auto 15px; border-radius: 50%;
            background: #D1FAE5; color: #10B981; display: flex; align-items: center; justify-content: center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-modal h3 { font-size: 22px; font-weight: 900; color: #1E293B; margin-bottom: 8px; }
        .success-modal p { font-size: 14px; font-weight: 700; color: #64748B; margin-bottom: 0; }
        .loader-dots { margin-top: 15px; font-size: 24px; color: #10B981; letter-spacing: 2px; animation: dotsPulse 1.5s infinite; }
        @keyframes dotsPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .radio-grid label { padding: 10px 2px; font-size: 11px; }
            .days-grid, .months-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div id="editAlert" class="edit-alert" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
        </svg>
        <span>أنت الآن في وضع تعديل بيانات المجموعة</span>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="success-modal">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" style="width: 36px; height: 36px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>
            <h3 id="successTitle">تم الحفظ بنجاح!</h3>
            <p id="successDesc">جاري تحضير التقرير، يرجى الانتظار...</p>
            <div class="loader-dots">...</div>
        </div>
    </div>

    <section class="hero-banner">
        <div class="hero-content">
            <div class="hero-brand">إعداد <span class="accent">المجموعة</span></div>
            <div class="hero-headline" id="lessonTitleDisplay">جاري الإعداد...</div>
        </div>
    </section>

    <div class="wizard-progress">
        <div class="progress-line"><div class="progress-line-fill" id="progressFill"></div></div>
        <div class="step-indicator active" id="indicator1">
            <div class="step-dot">1</div><div class="step-label">البيانات</div>
        </div>
        <div class="step-indicator" id="indicator2">
            <div class="step-dot">2</div><div class="step-label">المادة</div>
        </div>
        <div class="step-indicator" id="indicator3">
            <div class="step-dot">3</div><div class="step-label">الموقع والمواعيد</div>
        </div>
    </div>

    <!-- الخطوة 1 -->
    <div id="step1" class="step-content active theme-pink">
        <div class="smart-card">
            <h3 style="color: var(--c-dark); font-weight: 900; margin-bottom: 15px;">🔒 بيانات المجموعة الأساسية</h3>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>👥 اسم المجموعة</label>
                    <input type="text" id="g_name" class="form-control" placeholder="مثال: مجموعة الفيزياء العامة">
                </div>
                <div class="form-group">
                    <label>🏫 اسم السنتر (اختياري)</label>
                    <input type="text" id="g_center" class="form-control" placeholder="سنتر النخبة">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>👤 اسم المستر</label>
                    <input type="text" id="g_teacher" class="form-control" placeholder="أدخل اسم المعلم">
                </div>
                <div class="form-group">
                    <label>🔢 العدد المطلوب للطلاب</label>
                    <input type="number" id="g_count" class="form-control" placeholder="مثال: 25" min="1">
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>🎓 الفئات المسموح بها</label>
                <div class="radio-grid">
                    <div><input type="radio" name="g_gender" id="g_mix" value="مختلط" checked><label for="g_mix"><i>👫</i> مختلط</label></div>
                    <div><input type="radio" name="g_gender" id="g_boys" value="أولاد فقط"><label for="g_boys"><i>👨‍🎓</i> أولاد</label></div>
                    <div><input type="radio" name="g_gender" id="g_girls" value="بنات فقط"><label for="g_girls"><i>👩‍🎓</i> بنات</label></div>
                </div>
            </div>

            <div class="form-group">
                <label>📍 مكان الدرس الأساسي</label>
                <div class="radio-grid">
                    <div><input type="radio" name="g_loc" id="l_center" value="السنتر" checked><label for="l_center"><i>🏫</i> السنتر</label></div>
                    <div><input type="radio" name="g_loc" id="l_teach" value="بيت المستر"><label for="l_teach"><i>🏠</i> المستر</label></div>
                    <div><input type="radio" name="g_loc" id="l_stud" value="منزل الطالب"><label for="l_stud"><i>🚗</i> الطالب</label></div>
                </div>
            </div>
            
            <div class="nav-buttons">
                <button class="btn-next" onclick="nextStep(2)">التالي: المادة الدراسية ➔</button>
            </div>
        </div>
    </div>

    <!-- الخطوة 2 -->
    <div id="step2" class="step-content theme-turq">
        <div class="smart-card">
            <h3 style="color: var(--c-dark); font-weight: 900; margin-bottom: 15px;">📚 ما هي المادة التي تدرسها؟</h3>
            
            <div class="form-group">
                <label>🎓 المرحلة الدراسية</label>
                <select id="s_stage" class="form-control" onchange="updateGrades()">
                    <option value="">-- اختر المرحلة --</option>
                    <option value="primary">🎒 المرحلة الابتدائية</option>
                    <option value="prep">📐 المرحلة الإعدادية</option>
                    <option value="secondary">🎓 المرحلة الثانوية</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>👑 الصف الدراسي</label>
                    <select id="s_grade" class="form-control" disabled onchange="updateSubjects()">
                        <option value="">-- اختر المرحلة أولاً --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📖 المادة</label>
                    <select id="s_subject" class="form-control" disabled onchange="addSubject()">
                        <option value="">-- اختر الصف أولاً --</option>
                    </select>
                </div>
            </div>

            <div id="subjectChips" class="subject-chips"></div>

            <div class="nav-buttons">
                <button class="btn-prev" onclick="prevStep(1)">رجوع</button>
                <button class="btn-next" onclick="nextStep(3)">التالي: تحديد الموقع والمواعيد ➔</button>
            </div>
        </div>
    </div>

    <!-- الخطوة 3 -->
    <div id="step3" class="step-content theme-teal">
        <div class="smart-card">
            <h3 style="color: var(--c-dark); font-weight: 900; margin-bottom: 15px;">🗺️ تحديد الموقع الجغرافي وجدول المواعيد</h3>
            
            <!-- أيام الأسبوع -->
            <div class="form-group">
                <label>📅 أيام الحصص (اختر أيام الأسبوع)</label>
                <div class="days-grid">
                    <div><input type="checkbox" id="day_sat" value="السبت"><label for="day_sat">السبت</label></div>
                    <div><input type="checkbox" id="day_sun" value="الأحد"><label for="day_sun">الأحد</label></div>
                    <div><input type="checkbox" id="day_mon" value="الإثنين"><label for="day_mon">الإثنين</label></div>
                    <div><input type="checkbox" id="day_tue" value="الثلاثاء"><label for="day_tue">الثلاثاء</label></div>
                    <div><input type="checkbox" id="day_wed" value="الأربعاء"><label for="day_wed">الأربعاء</label></div>
                    <div><input type="checkbox" id="day_thu" value="الخميس"><label for="day_thu">الخميس</label></div>
                    <div><input type="checkbox" id="day_fri" value="الجمعة"><label for="day_fri">الجمعة</label></div>
                </div>
            </div>

            <!-- الشهور الميلادية -->
            <div class="form-group">
                <label>🗓️ الشهور الميلادية (اختر الشهر أو الشهور)</label>
                <div class="months-grid">
                    <div><input type="checkbox" id="m_jan" value="يناير"><label for="m_jan">يناير</label></div>
                    <div><input type="checkbox" id="m_feb" value="فبراير"><label for="m_feb">فبراير</label></div>
                    <div><input type="checkbox" id="m_mar" value="مارس"><label for="m_mar">مارس</label></div>
                    <div><input type="checkbox" id="m_apr" value="أبريل"><label for="m_apr">أبريل</label></div>
                    <div><input type="checkbox" id="m_may" value="مايو"><label for="m_may">مايو</label></div>
                    <div><input type="checkbox" id="m_jun" value="يونيو"><label for="m_jun">يونيو</label></div>
                    <div><input type="checkbox" id="m_jul" value="يوليو"><label for="m_jul">يوليو</label></div>
                    <div><input type="checkbox" id="m_aug" value="أغسطس"><label for="m_aug">أغسطس</label></div>
                    <div><input type="checkbox" id="m_sep" value="سبتمبر"><label for="m_sep">سبتمبر</label></div>
                    <div><input type="checkbox" id="m_oct" value="أكتوبر"><label for="m_oct">أكتوبر</label></div>
                    <div><input type="checkbox" id="m_nov" value="نوفمبر"><label for="m_nov">نوفمبر</label></div>
                    <div><input type="checkbox" id="m_dec" value="ديسمبر"><label for="m_dec">ديسمبر</label></div>
                </div>
            </div>

            <!-- أوقات الحصة -->
            <div class="grid-2" style="margin-top: 15px;">
                <div class="form-group">
                    <label>⏰ من الساعة</label>
                    <input type="time" id="g_start" class="form-control">
                </div>
                <div class="form-group">
                    <label>⏰ إلى الساعة</label>
                    <input type="time" id="g_end" class="form-control">
                </div>
            </div>

            <!-- ✅ خيار تكرار الحصة أسبوعياً -->
            <div class="form-group" style="background: #F0FDF8; padding: 12px; border-radius: 10px; border: 1.5px solid #A7F3D0; display: flex; align-items: center; gap: 12px;">
                <input type="checkbox" id="g_repeat_weekly" style="width: 22px; height: 22px; accent-color: var(--c-main); cursor: pointer;">
                <label for="g_repeat_weekly" style="margin: 0; cursor: pointer; font-size: 14px; font-weight: 800; color: #064E3B;">
                    🔄 تكرار الحصة تلقائياً كل أسبوع (في نفس المواعيد والأيام المحددة)
                </label>
            </div>

            <!-- الخريطة -->
            <div class="map-container" style="margin-top: 15px;">
                <div id="map"></div>
                <button type="button" class="locate-btn" onclick="requestCurrentLocation()" title="انتقل إلى موقعي الحالي">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 22px; height: 22px;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                    </svg>
                </button>
            </div>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>🏠 العنوان التفصيلي (للتسهيل على الطالب)</label>
                <input type="text" id="m_address" class="form-control" placeholder="سيتم تحديد موقعك تلقائياً هنا...">
            </div>

            <div class="nav-buttons">
                <button class="btn-prev" onclick="prevStep(2)">رجوع</button>
                <button class="btn-next" onclick="finishSetup()">✅ حفظ التعديلات وإنهاء</button>
            </div>
        </div>
    </div>

    <script>
        let currentLessonId = '1';
        let isEditMode = false;
        let mapInitialized = false;
        let map, marker;
        
        let currentStepNumber = 1;
        let selectedSubjects = [];
        let savedLat = null, savedLng = null;

        window.addEventListener('pageshow', function (event) {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.remove('active');
            }
        });

        // ✅ حفظ الحالة مع خيار التكرار الأسبوعي (بيانات كل مجموعة منعزلة بمعرفها lessonId لمنع تداخل المواعيد)
        function saveState() {
            const selectedDays = [];
            ['day_sat', 'day_sun', 'day_mon', 'day_tue', 'day_wed', 'day_thu', 'day_fri'].forEach(id => {
                const el = document.getElementById(id);
                if (el && el.checked) selectedDays.push(el.value);
            });

            const selectedMonths = [];
            ['m_jan', 'm_feb', 'm_mar', 'm_apr', 'm_may', 'm_jun', 'm_jul', 'm_aug', 'm_sep', 'm_oct', 'm_nov', 'm_dec'].forEach(id => {
                const el = document.getElementById(id);
                if (el && el.checked) selectedMonths.push(el.value);
            });

            const state = {
                step: currentStepNumber,
                g_name: document.getElementById('g_name').value,
                g_center: document.getElementById('g_center').value,
                g_teacher: document.getElementById('g_teacher').value,
                g_count: document.getElementById('g_count').value,
                g_start: document.getElementById('g_start').value,
                g_end: document.getElementById('g_end').value,
                g_days: selectedDays,
                g_months: selectedMonths,
                g_repeat_weekly: document.getElementById('g_repeat_weekly').checked,
                g_gender: document.querySelector('input[name="g_gender"]:checked')?.id,
                g_loc: document.querySelector('input[name="g_loc"]:checked')?.id,
                s_stage: document.getElementById('s_stage').value,
                s_grade: document.getElementById('s_grade').value,
                selectedSubjects: selectedSubjects,
                m_address: document.getElementById('m_address').value,
                lat: (mapInitialized && marker) ? marker.getLatLng().lat : savedLat,
                lng: (mapInitialized && marker) ? marker.getLatLng().lng : savedLng
            };
            sessionStorage.setItem('lessonState_' + currentLessonId, JSON.stringify(state));
        }

        // ✅ استرجاع الحالة وخيار التكرار الأسبوعي
        function loadState() {
            const saved = sessionStorage.getItem('lessonState_' + currentLessonId);
            if (saved) {
                const state = JSON.parse(saved);
                
                if(state.g_name) document.getElementById('g_name').value = state.g_name;
                if(state.g_center) document.getElementById('g_center').value = state.g_center;
                if(state.g_teacher) document.getElementById('g_teacher').value = state.g_teacher;
                if(state.g_count) document.getElementById('g_count').value = state.g_count;
                if(state.g_start) document.getElementById('g_start').value = state.g_start;
                if(state.g_end) document.getElementById('g_end').value = state.g_end;
                
                if(state.g_days && Array.isArray(state.g_days)) {
                    state.g_days.forEach(day => {
                        if(day === 'السبت') document.getElementById('day_sat').checked = true;
                        if(day === 'الأحد') document.getElementById('day_sun').checked = true;
                        if(day === 'الإثنين') document.getElementById('day_mon').checked = true;
                        if(day === 'الثلاثاء') document.getElementById('day_tue').checked = true;
                        if(day === 'الأربعاء') document.getElementById('day_wed').checked = true;
                        if(day === 'الخميس') document.getElementById('day_thu').checked = true;
                        if(day === 'الجمعة') document.getElementById('day_fri').checked = true;
                    });
                }

                if(state.g_months && Array.isArray(state.g_months)) {
                    const monthMap = {
                        'يناير': 'm_jan', 'فبراير': 'm_feb', 'مارس': 'm_mar', 'أبريل': 'm_apr',
                        'مايو': 'm_may', 'يونيو': 'm_jun', 'يوليو': 'm_jul', 'أغسطس': 'm_aug',
                        'سبتمبر': 'm_sep', 'أكتوبر': 'm_oct', 'نوفمبر': 'm_nov', 'ديسمبر': 'm_dec'
                    };
                    state.g_months.forEach(m => {
                        if(monthMap[m]) document.getElementById(monthMap[m]).checked = true;
                    });
                }

                if(state.g_repeat_weekly !== undefined) {
                    document.getElementById('g_repeat_weekly').checked = state.g_repeat_weekly;
                }

                if(state.g_gender) document.getElementById(state.g_gender).checked = true;
                if(state.g_loc) document.getElementById(state.g_loc).checked = true;
                
                if(state.s_stage) {
                    document.getElementById('s_stage').value = state.s_stage;
                    updateGrades();
                }
                if(state.s_grade) {
                    document.getElementById('s_grade').value = state.s_grade;
                    updateSubjects();
                }
                
                if(state.selectedSubjects) {
                    selectedSubjects = state.selectedSubjects;
                    renderChips();
                }

                if(state.m_address) document.getElementById('m_address').value = state.m_address;
                if(state.lat && state.lng) {
                    savedLat = state.lat;
                    savedLng = state.lng;
                }

                if(state.step && state.step > 1) {
                    nextStep(state.step, true);
                }
            }
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.has('lessonId')) currentLessonId = urlParams.get('lessonId');
            
            if(urlParams.has('mode') && urlParams.get('mode') === 'edit') {
                isEditMode = true;
                document.getElementById('editAlert').style.display = 'flex';
            }
            
            const titlePrefix = isEditMode ? 'تعديل مجموعة رقم' : 'إعداد مجموعة رقم';
            document.getElementById('lessonTitleDisplay').innerText = `${titlePrefix} ${currentLessonId}`;

            loadState();

            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('input', saveState);
                el.addEventListener('change', saveState);
            });
        };

        function nextStep(step, skipValidation = false) {
            if (!skipValidation) {
                if (step === 2) {
                    const gName = document.getElementById('g_name').value.trim();
                    const gTeacher = document.getElementById('g_teacher').value.trim();
                    const gCount = document.getElementById('g_count').value.trim();

                    if (!gName || !gTeacher || !gCount) {
                        alert("⚠️ برجاء إكمال جميع البيانات الأساسية (اسم المجموعة، المستر، والعدد).");
                        return; 
                    }
                }
                if (step === 3) {
                    if (selectedSubjects.length === 0) {
                        alert("⚠️ برجاء إضافة مادة دراسية واحدة على الأقل قبل المتابعة.");
                        return; 
                    }
                }
            }

            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
            
            for(let i=1; i<=3; i++){
                let ind = document.getElementById(`indicator${i}`);
                if(i < step) { ind.classList.remove('active'); ind.classList.add('completed'); }
                else if (i === step) { ind.classList.add('active'); ind.classList.remove('completed'); }
                else { ind.classList.remove('active'); ind.classList.remove('completed'); }
            }
            
            document.getElementById('progressFill').style.width = step === 1 ? '0%' : (step === 2 ? '50%' : '100%');

            currentStepNumber = step;
            saveState();

            if(step === 3 && !mapInitialized) {
                setTimeout(initMap, 300);
            }
        }

        function prevStep(step) {
            nextStep(step, true);
        }

        const curriculum = {
            primary: { grades: ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس'], subjs: ['عربي', 'إنجليزي', 'رياضيات', 'علوم'] },
            prep: { grades: ['الأول الإعدادي', 'الثاني الإعدادي', 'الثالث الإعدادي'], subjs: ['عربي', 'إنجليزي', 'رياضيات', 'علوم', 'دراسات'] },
            secondary: { grades: ['الأول الثانوي', 'الثاني الثانوي', 'الثالث الثانوي'], subjs: ['فيزياء', 'كيمياء', 'أحياء', 'رياضيات'] }
        };

        function updateGrades() {
            const stage = document.getElementById('s_stage').value;
            const gSelect = document.getElementById('s_grade');
            gSelect.innerHTML = '<option value="">-- اختر الصف --</option>';
            if(stage) {
                curriculum[stage].grades.forEach(g => gSelect.innerHTML += `<option value="${g}">${g}</option>`);
                gSelect.disabled = false;
            } else { gSelect.disabled = true; document.getElementById('s_subject').disabled = true; }
        }

        function updateSubjects() {
            const stage = document.getElementById('s_stage').value;
            const sSelect = document.getElementById('s_subject');
            sSelect.innerHTML = '<option value="">-- اختر مادة --</option>';
            if(stage && document.getElementById('s_grade').value) {
                curriculum[stage].subjs.forEach(s => sSelect.innerHTML += `<option value="${s}">${s}</option>`);
                sSelect.disabled = false;
            } else { sSelect.disabled = true; }
        }

        function addSubject() {
            const grade = document.getElementById('s_grade').value;
            const subj = document.getElementById('s_subject').value;
            if(!subj) return;
            
            const newSubject = `${grade} - ${subj}`;
            if (!selectedSubjects.includes(newSubject)) {
                selectedSubjects.push(newSubject);
                renderChips();
                saveState();
            }
            document.getElementById('s_subject').value = '';
        }

        function renderChips() {
            const container = document.getElementById('subjectChips');
            container.innerHTML = '';
            selectedSubjects.forEach((s, idx) => {
                container.innerHTML += `<div class="chip">${s} <span onclick="removeSubj(${idx})">✖</span></div>`;
            });
        }
        
        function removeSubj(idx) { 
            selectedSubjects.splice(idx, 1); 
            renderChips(); 
            saveState();
        }

        function initMap() {
            let defaultLatLng = (savedLat && savedLng) ? [savedLat, savedLng] : [30.0444, 31.2357];
            
            map = L.map('map').setView(defaultLatLng, (savedLat ? 16 : 13));
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker(defaultLatLng, { draggable: true }).addTo(map);
            mapInitialized = true;
            map.invalidateSize();

            if (!savedLat) {
                requestCurrentLocation();
            }

            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                document.getElementById('m_address').value = "جاري تحديث العنوان...";
                fetchAddress(pos.lat, pos.lng);
            });
        }

        function requestCurrentLocation() {
            if (navigator.geolocation) {
                document.getElementById('m_address').value = "جاري تحديد موقعك بدقة...";
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const newLatLng = new L.LatLng(lat, lng);
                        
                        map.setView(newLatLng, 16);
                        marker.setLatLng(newLatLng);
                        
                        fetchAddress(lat, lng);
                    },
                    function(error) {
                        alert("⚠️ تعذر تحديد موقعك. يرجى التأكد من تفعيل خدمة الـ GPS في جهازك.");
                        document.getElementById('m_address').value = ""; 
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("⚠️ متصفحك لا يدعم خاصية تحديد الموقع.");
            }
        }

        function fetchAddress(lat, lng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ar`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.display_name) {
                        document.getElementById('m_address').value = data.display_name;
                    } else {
                        document.getElementById('m_address').value = "لم نتمكن من تحديد اسم الشارع، يمكنك كتابته يدوياً.";
                    }
                    saveState();
                })
                .catch(error => {
                    console.error("خطأ في جلب العنوان:", error);
                    document.getElementById('m_address').value = "";
                });
        }

        function finishSetup() {
            const gStart = document.getElementById('g_start').value;
            const gEnd = document.getElementById('g_end').value;
            const address = document.getElementById('m_address').value.trim();

            if (!gStart || !gEnd) {
                alert("⚠️ برجاء تحديد موعد بداية ونهاية الحصة.");
                return;
            }

            if (!address || address.includes("جاري")) {
                alert("⚠️ برجاء التأكد من كتابة العنوان التفصيلي لتسهيل وصول الطلاب.");
                return; 
            }

            saveState();

            const modal = document.getElementById('successModal');
            const title = document.getElementById('successTitle');
            
            title.innerText = isEditMode ? "تم تحديث بيانات المجموعة بنجاح!" : "تم حفظ إعدادات المجموعة بنجاح!";
            modal.classList.add('active');

            setTimeout(() => {
                window.location.href = `end.html?lessonId=${currentLessonId}`; 
            }, 1200);
        }
    </script>
</body>
</html>
