<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة احجزلى - تسجيل دخول المعلم</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { corePlugins: { preflight: true } }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-950:#0A1E3F; --primary-900:#0F2D5C; --primary-600:#2563EB;
        }
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            min-height: 280px;
            background-image: url('./teacher2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 40px 20px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.75) 0%, 
                rgba(255, 255, 255, 0.90) 50%, 
                rgba(255, 255, 255, 0.98) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            width: 100%;
        }

        .hero-brand {
            font-size: 36px;
            font-weight: 900;
            color: #0F172A;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .hero-brand .accent {
            color: #F59E0B;
            position: relative;
        }
        
        .hero-brand .accent::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #F59E0B, #FCD34D);
            border-radius: 999px;
        }

        .auth-container {
            width: 90%;
            max-width: 450px;
            margin: -50px auto 30px;
            position: relative;
            z-index: 10;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
            border: 2px solid #E2E8F0;
        }

        .auth-tabs {
            display: flex;
            background: #F1F5F9;
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 15px;
            font-weight: 800;
            color: #64748B;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: #FFFFFF;
            color: var(--primary-600);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 6px;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1E293B;
            background: #F8FAFC;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .custom-input:focus {
            border-color: var(--primary-600);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px #DBEAFE;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }
        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 15px;
            background: #F1F5F9;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 800;
            color: #475569;
            transition: all 0.3s;
            font-size: 17px;
        }
        
        .avatar-img {
            width: 48px; 
            height: 48px; 
            border-radius: 50%;
            object-fit: cover;
            object-position: top; 
            border: 2px solid #CBD5E1;
            background: #000; 
            transition: all 0.3s;
        }

        .radio-input {
            display: none;
        }
        
        .radio-input[value="مستر"]:checked + .radio-label {
            background: #EFF6FF;
            border-color: var(--primary-600);
            color: var(--primary-600);
            transform: translateY(-2px);
        }
        .radio-input[value="مستر"]:checked + .radio-label .avatar-img {
            border-color: var(--primary-600);
            transform: scale(1.15);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.4);
        }

        .radio-input[value="مس"]:checked + .radio-label {
            background: #FDF2F8;
            border-color: #EC4899;
            color: #DB2777;
            transform: translateY(-2px);
        }
        .radio-input[value="مس"]:checked + .radio-label .avatar-img {
            border-color: #EC4899;
            transform: scale(1.15);
            box-shadow: 0 5px 12px rgba(236, 72, 153, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-900));
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-buttons-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px auto 30px;
            padding: 0 15px;
            max-width: 450px;
        }

        .btn-logout {
            background: #F1F5F9;
            color: #475569;
            border: 2px solid #E2E8F0;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }

        .btn-delete-small {
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .alert-msg {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }

        .custom-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            padding: 15px;
        }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal-box {
            background: #FFFFFF;
            width: 90%;
            max-width: 340px;
            border-radius: 22px;
            padding: 22px 18px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            transform: translateY(20px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-bottom: 5px solid #2563EB;
        }
        .custom-modal-overlay.active .custom-modal-box { transform: translateY(0) scale(1); }
        .modal-icon-circle {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .modal-title-text { font-size: 19px; font-weight: 900; color: #0F2D5C; margin-bottom: 6px; }
        .modal-desc-text { font-size: 13px; font-weight: 700; color: #64748B; margin-bottom: 18px; line-height: 1.6; }
        .modal-btn-row { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; }
        .modal-btn-cancel { background: #E2E8F0; color: #475569; }
        .modal-btn-danger { background: #EF4444; color: #FFFFFF; }
    </style>
</head>
<body>

    <div id="confirmDeleteModal" class="custom-modal-overlay" onclick="closeCustomModal('confirmDeleteModal')">
        <div class="custom-modal-box" style="border-bottom-color: #EF4444;" onclick="event.stopPropagation()">
            <div class="modal-icon-circle" style="background: #FEE2E2; color: #DC2626;">⚠️</div>
            <h3 class="modal-title-text" style="color: #991B1B;">هل أنت متأكد من حذف الحساب؟</h3>
            <p class="modal-desc-text">سيتم حذف بياناتك فقط نهائياً ولن يمكنك التراجع</p>
            <div class="modal-btn-row">
                <button type="button" class="modal-btn modal-btn-cancel" onclick="closeCustomModal('confirmDeleteModal')">إلغاء</button>
                <button type="button" class="modal-btn modal-btn-danger" onclick="executeDeleteAccount()">نعم، احذف</button>
            </div>
        </div>
    </div>

    <div id="deletedSuccessModal" class="custom-modal-overlay">
        <div class="custom-modal-box" style="border-bottom-color: #10B981;">
            <div class="modal-icon-circle" style="background: #D1FAE5; color: #059669;">✅</div>
            <h3 class="modal-title-text" style="color: #065F46;">تم حذف الحساب</h3>
            <p class="modal-desc-text">تم حذف بيانات الحساب بنجاح، جاري الرجوع...</p>
        </div>
    </div>

    <section class="hero-banner">
        <div class="hero-content">
            <div class="hero-brand">بوابة <span class="accent">المعلمين</span></div>
            <p style="color: #475569; font-weight: 800; margin-top: 10px; font-size: 15px;">سجل دخولك أو أنشئ حساباً جديداً لإدارة حصصك</p>
        </div>
    </section>

    <div id="authFormsContainer" class="auth-container">
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</div>
            <div class="auth-tab" id="tab-register" onclick="switchTab('register')">حساب جديد</div>
        </div>

        <div id="alertMsg" class="alert-msg"></div>

        <div id="loginForm">
            <div class="input-group">
                <label class="input-label">رقم التليفون (11 رقم)</label>
                <input type="tel" id="loginPhone" class="custom-input" placeholder="01012345678" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="input-group">
                <label class="input-label">الرقم السري (4 أرقام)</label>
                <input type="password" id="loginPassword" class="custom-input" placeholder="أدخل 4 أرقام" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button class="btn-submit" onclick="handleLogin()">دخول</button>
        </div>

        <div id="registerForm" style="display: none;">
            <div class="input-group">
                <label class="input-label">اللقب</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="title" value="مستر" class="radio-input" checked>
                        <div class="radio-label"><img src="./teacher.png" alt="مستر" class="avatar-img"><span>مستر</span></div>
                    </label>
                    <label>
                        <input type="radio" name="title" value="مس" class="radio-input">
                        <div class="radio-label"><img src="./miss.png" alt="مس" class="avatar-img"><span>مس</span></div>
                    </label>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">الاسم الكامل</label>
                <input type="text" id="regName" class="custom-input" placeholder="اكتب اسمك هنا">
            </div>
            <div class="input-group">
                <label class="input-label">العمر</label>
                <input type="number" id="regAge" class="custom-input" placeholder="30">
            </div>
            <div class="input-group">
                <label class="input-label">رقم التليفون (11 رقم)</label>
                <input type="tel" id="regPhone" class="custom-input" placeholder="01012345678" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="input-group">
                <label class="input-label">الرقم السري (4 أرقام)</label>
                <input type="password" id="regPassword1" class="custom-input" placeholder="أدخل 4 أرقام" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="input-group">
                <label class="input-label">تأكيد الرقم السري</label>
                <input type="password" id="regPassword2" class="custom-input" placeholder="أدخل 4 أرقام" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button class="btn-submit" onclick="handleRegister()">إنشاء حساب</button>
        </div>
    </div>

    <div id="actionButtonsContainer" class="action-buttons-container" style="display: flex;">
        <button class="btn-logout" onclick="handleLogout()">الرئيسية</button>
        <button class="btn-delete-small" onclick="confirmDeleteAccount()">حذف الحساب</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHighPitchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(2800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
        document.addEventListener('click', e => {
            if (e.target.closest('button, .auth-tab, .radio-label, .modal-btn')) playHighPitchSound();
        });

        window.onload = function() {
            // مسح جلسة الدخول السابقة لإجبار المعلم على إدخال الرقم السري في كل مرة يفتح فيها الصفحة
            localStorage.removeItem('loggedInTeacher');

            // الاحتفاظ برقم التليفون فقط في الحقول إذا كان محفوظاً مسبقاً
            const rememberedPhone = localStorage.getItem('rememberedPhone');
            if (rememberedPhone) {
                document.getElementById('loginPhone').value = rememberedPhone;
                document.getElementById('regPhone').value = rememberedPhone;
                document.getElementById('loginPassword').value = ''; // تفريغ حقل الرقم السري
            }
        };

        function closeCustomModal(id) { document.getElementById(id).classList.remove('active'); }

        function switchTab(tab) {
            document.getElementById('alertMsg').style.display = 'none';
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            }
        }

        function showAlert(msg, isError = true) {
            const el = document.getElementById('alertMsg');
            el.textContent = msg;
            el.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function handleRegister() {
            const title = document.querySelector('input[name="title"]:checked').value;
            const name = document.getElementById('regName').value.trim();
            const age = document.getElementById('regAge').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass1 = document.getElementById('regPassword1').value;
            const pass2 = document.getElementById('regPassword2').value;

            if (!name || !age || !phone || !pass1 || !pass2) return showAlert('الرجاء إكمال جميع البيانات.');
            if (phone.length !== 11) return showAlert('رقم التليفون يجب أن يكون 11 رقماً.');
            if (pass1.length !== 4) return showAlert('الرقم السري يجب أن يكون 4 أرقام.');
            if (pass1 !== pass2) return showAlert('الرقمان السريان غير متطابقين.');

            if (localStorage.getItem('teacherAccount_' + phone)) return showAlert('هذا الرقم مسجل مسبقاً!');

            const accountData = { title, name, age, phone, pass: pass1, createdAt: new Date().toISOString().split('T')[0] };
            localStorage.setItem('teacherAccount_' + phone, JSON.stringify(accountData));
            localStorage.setItem('rememberedPhone', phone);
            localStorage.setItem('loggedInTeacher', JSON.stringify(accountData));

            // التوجه المباشر بدون رسالة ترحيب منبثقة
            window.location.href = './index2.html';
        }

        function handleLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (phone.length !== 11 || pass.length !== 4) return showAlert('يرجى إدخال بيانات صحيحة.');
            const savedDataStr = localStorage.getItem('teacherAccount_' + phone);
            if (!savedDataStr) return showAlert('هذا الرقم غير مسجل.');

            const savedData = JSON.parse(savedDataStr);
            if (savedData.pass !== pass) return showAlert('الرقم السري غير صحيح.');

            const isBlocked = localStorage.getItem('teacherBlocked_' + phone) === 'true' || localStorage.getItem('teacherBlocked_name_' + savedData.name) === 'true';
            
            if (isBlocked) {
                return showAlert('عذراً، هذا الحساب محظور (تم إرساله للأرشيف). يرجى التواصل مع الإدارة.');
            }

            localStorage.setItem('loggedInTeacher', JSON.stringify(savedData));
            localStorage.setItem('rememberedPhone', phone);

            // التوجه المباشر بدون رسالة ترحيب منبثقة
            window.location.href = './index2.html';
        }

        function handleLogout() { 
            localStorage.removeItem('loggedInTeacher');
            window.location.href = './index.html'; 
        }

        function confirmDeleteAccount() {
            const phone = document.getElementById('loginPhone').value.trim() || document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('loginPassword').value || document.getElementById('regPassword1').value;

            if (!phone || !localStorage.getItem('teacherAccount_' + phone)) return showAlert('لا يوجد حساب مسجل لهذا الرقم.');
            if (!pass) return showAlert('يرجى كتابة الرقم السري الخاص بك لتأكيد الحذف.');

            const savedData = JSON.parse(localStorage.getItem('teacherAccount_' + phone));
            if (savedData.pass !== pass) return showAlert('الرقم السري غير صحيح، لا يمكنك حذف الحساب.');

            document.getElementById('confirmDeleteModal').classList.add('active');
        }

        function executeDeleteAccount() {
            closeCustomModal('confirmDeleteModal');
            const phone = document.getElementById('loginPhone').value.trim() || document.getElementById('regPhone').value.trim();
            if (phone) {
                const savedDataStr = localStorage.getItem('teacherAccount_' + phone);
                let cleanName = '';
                if (savedDataStr) {
                    try {
                        const savedData = JSON.parse(savedDataStr);
                        cleanName = (savedData.name || '').replace(/^(مستر|مس|أستاذ|أستاذه|استاذ|استاذه|م\.|أ\.)\s+/i, '').replace(/^\/\s*/, '').trim();
                    } catch(e) {}
                }

                localStorage.removeItem('teacherAccount_' + phone);
                localStorage.removeItem('teacherVerification_' + phone);
                localStorage.removeItem('teacherBlocked_' + phone);
                if (cleanName) {
                    localStorage.removeItem('teacherVerification_name_' + cleanName);
                    localStorage.removeItem('teacherBlocked_name_' + cleanName);
                }
                
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('lessonState_')) {
                        try {
                            const st = JSON.parse(localStorage.getItem(k) || '{}');
                            const stCleanName = (st.g_teacher || '').replace(/^(مستر|مس|أستاذ|أستاذه|استاذ|استاذه|م\.|أ\.)\s+/i, '').replace(/^\/\s*/, '').trim();
                            
                            if (st.g_phone === phone || (cleanName && stCleanName === cleanName)) {
                                const id = k.replace('lessonState_', '');
                                keysToRemove.push('lessonState_' + id); 
                                keysToRemove.push('publishState_' + id);
                            }
                        } catch (e) {}
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));

                localStorage.removeItem('loggedInTeacher'); 
                
                document.getElementById('deletedSuccessModal').classList.add('active');
                setTimeout(() => { window.location.href = './index.html'; }, 1400);
            }
        }
    </script>
</body>
</html>
