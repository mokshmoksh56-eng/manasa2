<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>تقرير الدرس - جاهز للنشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .report-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.15);
            overflow: hidden;
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-align: center;
            padding: 24px 20px;
            position: relative;
        }

        .report-header h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .report-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .report-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .info-icon {
            font-size: 24px;
            background: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .info-details {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 800;
        }

        .info-value {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 900;
        }

        .map-section {
            padding: 0 20px 20px;
        }

        .map-title {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
        }

        #static-map {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            z-index: 1;
        }

        .missing-data {
            text-align: center;
            padding: 30px;
            color: #ef4444;
            font-weight: 900;
            font-size: 16px;
        }

        .btn-publish {
            margin: 0 20px 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }

        .btn-publish:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="report-container" id="report-container">
        <!-- سيتم ملء البيانات هنا بواسطة الجافاسكربت -->
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            generateReport();
        });

        function generateReport() {
            const container = document.getElementById('report-container');
            
            // جلب البيانات من الخطوات السابقة
            const fixedDataRaw = localStorage.getItem('schedule_fixed_data');
            const subjectsDataRaw = localStorage.getItem('schedule_subjects');
            const locationDataRaw = localStorage.getItem('selected_location_data');

            if (!fixedDataRaw || !subjectsDataRaw) {
                container.innerHTML = `
                    <div class="missing-data">
                        ⚠️ الرجاء إكمال الخطوة الأولى (البيانات) والثانية (المواد) لرؤية التقرير.
                    </div>`;
                return;
            }

            const fixedData = JSON.parse(fixedDataRaw);
            const subjectsData = JSON.parse(subjectsDataRaw);
            const locData = locationDataRaw ? JSON.parse(locationDataRaw) : null;

            // تجميع أسماء المواد
            const subjectNames = subjectsData.map(s => s.subject).join('، ');
            const stageInfo = subjectsData.length > 0 ? `${subjectsData[0].stageName} - ${subjectsData[0].grade}` : '';

            // تحويل صيغة الوقت لشكل جميل
            const startTime = fixedData.startTime || 'غير محدد';
            const endTime = fixedData.endTime || 'غير محدد';
            
            // بناء الواجهة
            container.innerHTML = `
                <div class="report-header">
                    <h1>إعلان موعد الدرس 📢</h1>
                    <p>أهلاً بكم طلابنا الأعزاء، ننتظركم في الموعد المحدد</p>
                </div>

                <div class="report-content">
                    
                    <div class="info-row">
                        <div class="info-icon">👨‍🏫</div>
                        <div class="info-details">
                            <span class="info-label">المعلم / المجموعة</span>
                            <span class="info-value">مستر ${fixedData.teacherName || 'غير مسجل'} - ${fixedData.groupName || 'مجموعة'}</span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="info-icon">📚</div>
                        <div class="info-details">
                            <span class="info-label">المادة والمرحلة</span>
                            <span class="info-value">${subjectNames} (${stageInfo})</span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="info-icon">⏰</div>
                        <div class="info-details">
                            <span class="info-label">موعد الدرس</span>
                            <span class="info-value">من ${startTime} إلى ${endTime}</span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="info-icon">📍</div>
                        <div class="info-details">
                            <span class="info-label">مكان الدرس</span>
                            <span class="info-value">${fixedData.location || 'السنتر'} ${fixedData.centerName ? `(${fixedData.centerName})` : ''}</span>
                        </div>
                    </div>

                </div>

                <div class="map-section" id="map-section">
                    <div class="map-title">🗺️ خريطة الموقع</div>
                    <div id="static-map"></div>
                </div>

                <button class="btn-publish" onclick="window.print()">
                    <span>🖨️</span> طباعة / حفظ كصورة
                </button>
            `;

            // إضافة الخريطة الثابتة إذا كانت الإحداثيات موجودة
            if (locData && locData.lat && locData.lng) {
                initStaticMap(locData.lat, locData.lng, locData.street);
            } else {
                document.getElementById('map-section').innerHTML = `
                    <div class="map-title">🗺️ خريطة الموقع</div>
                    <div style="text-align:center; padding: 20px; background: #f1f5f9; border-radius: 12px; color: #64748b; font-weight: 800;">
                        لم يتم تحديد موقع على الخريطة ❌
                    </div>`;
            }
        }

        function initStaticMap(lat, lng, streetName) {
            // الخريطة الثابتة (يتم تعطيل كل أدوات التحكم والتحريك)
            const map = L.map('static-map', {
                center: [lat, lng],
                zoom: 16,
                zoomControl: false,       // إخفاء أزرار الزووم
                dragging: false,          // منع السحب
                scrollWheelZoom: false,   // منع زووم البكرة
                doubleClickZoom: false,   // منع زووم الدبل كليك
                boxZoom: false,
                keyboard: false,
                touchZoom: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const marker = L.marker([lat, lng]).addTo(map);
            
            if (streetName) {
                marker.bindPopup(`<div style="font-family:Cairo; font-weight:bold; text-align:center;">${streetName}</div>`).openPopup();
            } else {
                marker.bindPopup(`<div style="font-family:Cairo; font-weight:bold; text-align:center;">موقع الدرس</div>`).openPopup();
            }
        }
    </script>
</body>
</html>
