<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>بيانات المجموعة - التصميم الوردي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;          
            --primary-dark: #E03131;     
            --primary-light: #FFE3E3;    
            --primary-lightest: #FFF5F5; 
            --primary-border: #FFC9C9;   
            --text-theme: #A61E1E;       
            
            --bg-color: #f7f9fa;
            --text-dark: #1e293b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            padding: 30px 15px 60px;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ========================================================== */
        /* 🔒 كارت البيانات الثابتة للجدول */
        /* ========================================================== */
        .fixed-group-data-card {
            background: linear-gradient(160deg, var(--primary-lightest) 0%, var(--primary-light) 100%);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 20px -8px rgba(255, 107, 107, 0.35);
            position: relative;
            overflow: hidden;
            animation: lockCardAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .fixed-group-data-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--primary));
        }

        @keyframes lockCardAppear {
            from { opacity: 0; transform: translateY(15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes lockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(-5deg); }
        }

        .fixed-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .fixed-group-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14.5px;
            font-weight: 900;
            color: var(--text-theme);
        }

        .fixed-group-title .fixed-icon {
            font-size: 18px;
            animation: lockPulse 2s ease-in-out infinite;
        }

        .fixed-group-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 10.5px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .fixed-group-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .fixed-group-body .form-group {
            margin-bottom: 0;
        }

        .fixed-group-body .form-group label {
            font-size: 12px;
            color: var(--text-theme);
            font-weight: 900;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .fixed-group-body .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--primary-border);
            border-top: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 800;
            color: var(--text-dark);
            background: #fff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .fixed-group-body .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 8px 15px rgba(255, 107, 107, 0.15), 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        .fixed-group-body select.form-control {
            background: #fff url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6B6B' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e") no-repeat left 12px center;
            background-size: 13px;
            padding-left: 32px;
            appearance: none;
            cursor: pointer;
        }

        .time-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            grid-column: 1 / -1;
        }

        .fixed-group-hint {
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-theme);
            opacity: 0.8;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px dashed var(--primary-border);
            line-height: 1.5;
        }

        /* ========================================================== */
        /* 🔢 شارات الترقيم */
        /* ========================================================== */
        .num-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(255, 107, 107, 0.35);
        }

        .num-badge-lg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(255, 107, 107, 0.35);
        }

        /* ========================================================== */
        /* ✅ Smart Time Select Styles */
        /* ========================================================== */
        select.smart-time-select option.smart-valid {
            background: #D1FAE5 !important;
            color: #065F46 !important;
            font-weight: 900 !important;
        }
        select.smart-time-select option.smart-recommended {
            background: #FEF3C7 !important;
            color: #78350F !important;
            font-weight: 900 !important;
        }
        select.smart-time-select option.smart-invalid {
            background: #F1F5F9 !important;
            color: #94A3B8 !important;
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* ========================================================== */
        /* 🎓 الفئات + مكان الدرس */
        /* ========================================================== */
        .options-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed var(--primary-border);
        }

        .options-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 900;
            color: var(--text-theme);
            margin-bottom: 10px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cards-grid input[type="radio"] {
            display: none;
        }

        .cards-grid label {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 6px;
            background: #fff;
            border: 2px solid var(--primary-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            font-weight: 900;
            color: var(--text-theme);
            font-size: 12px;
            min-height: 72px;
            user-select: none;
        }

        .cards-grid label i {
            font-size: 24px;
            margin-bottom: 6px;
            font-style: normal;
            line-height: 1;
        }

        .cards-grid label:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(255, 107, 107, 0.15);
        }

        .cards-grid input[type="radio"]:checked + label {
            background: linear-gradient(160deg, var(--primary-lightest), var(--primary-light));
            border-color: var(--primary);
            color: var(--text-theme);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px -4px rgba(255, 107, 107, 0.4);
        }

        .cards-grid input[type="radio"]:checked + label::after {
            content: "✔";
            position: absolute;
            top: -6px;
            left: -6px;
            width: 22px;
            height: 22px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(255, 107, 107, 0.5);
        }

        /* ========================================================== */
        /* 💾 زر الحفظ */
        /* ========================================================== */
        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 18px -4px rgba(255, 107, 107, 0.6);
            transition: all 0.25s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -4px rgba(255, 107, 107, 0.8);
        }
        .save-btn:active { transform: scale(0.97); }

        /* ========================================================== */
        /* ✅ شارة الحفظ التلقائي */
        /* ========================================================== */
        .autosave-bar {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: #1e293b;
            color: var(--white);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            z-index: 9998;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
            display: none;
            align-items: center;
            gap: 5px;
        }
        .autosave-bar.show {
            display: flex;
            animation: slideIn 0.3s ease;
        }
        .autosave-bar .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulseDot 1.5s infinite;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ========================================================== */
        /* 📱 Responsive */
        /* ========================================================== */
        @media (max-width: 600px) {
            .fixed-group-body { grid-template-columns: 1fr; }
            .time-group { grid-template-columns: 1fr; grid-column: 1; }
            .cards-grid { gap: 6px; }
            .cards-grid label { min-height: 66px; padding: 10px 4px; font-size: 11px; }
            .cards-grid label i { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ✅ كارت بيانات المجموعة -->
        <div id="fixedGroupDataCard" class="fixed-group-data-card">
            <div class="fixed-group-header">
                <div class="fixed-group-title">
                    <span class="fixed-icon">🔒</span>
                    <span>بيانات المجموعة (تُحفظ مع الجدول)</span>
                </div>
                <span class="fixed-group-badge">ثابتة</span>
            </div>

            <div class="fixed-group-body">
                <div class="form-group">
                    <label><span class="num-badge">1</span> 👥 اسم المجموعة</label>
                    <input type="text" id="fg-group-name" class="form-control" placeholder="مثال: مجموعة السبت">
                </div>

                <div class="form-group">
                    <label><span class="num-badge">2</span> 🏫 اسم السنتر (اختياري)</label>
                    <input type="text" id="fg-center-name" class="form-control" placeholder="سنتر النخبة التعليمي">
                </div>

                <div class="form-group">
                    <label><span class="num-badge">3</span> 👤 اسم المستر</label>
                    <input type="text" id="fg-teacher-name" class="form-control" placeholder="اسمك">
                </div>

                <div class="form-group">
                    <label><span class="num-badge">4</span> 👥 العدد المطلوب</label>
                    <input type="number" id="fg-students-count" class="form-control" min="1" value="20">
                </div>

                <div class="time-group">
                    <div class="form-group">
                        <label><span class="num-badge">5</span> ⏰ من الساعة</label>
                        <select id="fg-start-time" class="form-control smart-time-select"></select>
                    </div>
                    <div class="form-group">
                        <label><span class="num-badge">6</span> ⏰ إلى الساعة</label>
                        <select id="fg-end-time" class="form-control smart-time-select"></select>
                    </div>
                </div>
            </div>

            <!-- ================================================ -->
            <!-- 🎓 الفئات المسموح بها -->
            <!-- ================================================ -->
            <div class="options-section">
                <div class="options-section-title">
                    <span class="num-badge-lg">7</span>
                    <span>🎓 الفئات المسموح بها</span>
                </div>
                <div class="cards-grid">
                    <div>
                        <input type="radio" name="fg-gender" id="fg-gender-mixed" value="مختلط" checked>
                        <label for="fg-gender-mixed"><i>👫</i> مختلط</label>
                    </div>
                    <div>
                        <input type="radio" name="fg-gender" id="fg-gender-boys" value="أولاد فقط">
                        <label for="fg-gender-boys"><i>👨‍🎓</i> أولاد</label>
                    </div>
                    <div>
                        <input type="radio" name="fg-gender" id="fg-gender-girls" value="بنات فقط">
                        <label for="fg-gender-girls"><i>👩‍🎓</i> بنات</label>
                    </div>
                </div>
            </div>

            <!-- ================================================ -->
            <!-- 📍 مكان الدرس -->
            <!-- ================================================ -->
            <div class="options-section">
                <div class="options-section-title">
                    <span class="num-badge-lg">8</span>
                    <span>📍 مكان الدرس</span>
                </div>
                <div class="cards-grid">
                    <div>
                        <input type="radio" name="fg-location" id="fg-loc-center" value="السنتر" checked>
                        <label for="fg-loc-center"><i>🏫</i> السنتر</label>
                    </div>
                    <div>
                        <input type="radio" name="fg-location" id="fg-loc-teacher" value="بيت المستر">
                        <label for="fg-loc-teacher"><i>🏠</i> بيت المستر</label>
                    </div>
                    <div>
                        <input type="radio" name="fg-location" id="fg-loc-student" value="منزل الطالب">
                        <label for="fg-loc-student"><i>🚗</i> منزل الطالب</label>
                    </div>
                </div>
            </div>

            <div class="fixed-group-hint" style="margin-top: 14px;">
                💡 البيانات دي هتتثبت تلقائياً في صفحة المواعيد ومش هتحتاج تدخلها تاني
            </div>
        </div>

        <!-- ✅ زر الحفظ -->
        <button class="save-btn" onclick="window.saveFixedGroupData()">
            <span>💾</span>
            <span>حفظ البيانات</span>
        </button>

    </div>

    <!-- ✅ شارة الحفظ التلقائي -->
    <div class="autosave-bar" id="autosave-bar">
        <span class="dot"></span>
        <span>تم الحفظ تلقائياً</span>
    </div>

    <script>
        // ==========================================================
        // ✅ نظام الأوقات الذكي
        // ==========================================================
        const TIME_SLOTS_FG = [];
        for (let h = 0; h < 24; h++) {
            for (let m = 0; m < 60; m += 30) {
                const hour12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
                const period = h < 12 ? 'ص' : 'م';
                const mm = String(m).padStart(2, '0');
                const value = `${String(h).padStart(2, '0')}:${mm}`;
                const label = `${hour12}:${mm} ${period}`;
                TIME_SLOTS_FG.push({ value, label });
            }
        }

        function calcMinutesDiffFG(startVal, endVal) {
            if (!startVal || !endVal) return 0;
            const [sh, sm] = startVal.split(':').map(Number);
            const [eh, em] = endVal.split(':').map(Number);
            return (eh * 60 + em) - (sh * 60 + sm);
        }

        function buildSmartTimeOptions(selectEl, options = {}) {
            const { isEndTime = false, startTimeValue = '' } = options;
            const previousValue = selectEl.value;
            selectEl.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- اختر --';
            selectEl.appendChild(placeholder);

            let minMinutes = -1;
            if (isEndTime && startTimeValue) {
                const [sh, sm] = startTimeValue.split(':').map(Number);
                minMinutes = sh * 60 + sm;
            }

            let firstValidValue = null;
            if (isEndTime && minMinutes >= 0) {
                const validSlot = TIME_SLOTS_FG.find(slot => {
                    const [h, m] = slot.value.split(':').map(Number);
                    return (h * 60 + m) > minMinutes;
                });
                if (validSlot) firstValidValue = validSlot.value;
            }

            TIME_SLOTS_FG.forEach(slot => {
                const [h, m] = slot.value.split(':').map(Number);
                const slotMinutes = h * 60 + m;

                const opt = document.createElement('option');
                opt.value = slot.value;

                if (isEndTime && minMinutes >= 0 && slotMinutes <= minMinutes) {
                    opt.textContent = `🔒 ${slot.label}`;
                    opt.disabled = true;
                    opt.classList.add('smart-invalid');
                } else if (isEndTime && slot.value === firstValidValue) {
                    opt.textContent = `⭐ ${slot.label} — موصى به`;
                    opt.classList.add('smart-recommended');
                } else if (isEndTime && minMinutes >= 0) {
                    opt.textContent = slot.label;
                    opt.classList.add('smart-valid');
                } else {
                    opt.textContent = slot.label;
                }

                selectEl.appendChild(opt);
            });

            if (previousValue) {
                const prevOpt = Array.from(selectEl.options).find(
                    o => o.value === previousValue && !o.disabled
                );
                if (prevOpt) selectEl.value = previousValue;
                else if (isEndTime && firstValidValue) selectEl.value = firstValidValue;
            }
        }

        function populateFixedGroupTimeSelects(preserveStart = null, preserveEnd = null) {
            const startSel = document.getElementById('fg-start-time');
            const endSel = document.getElementById('fg-end-time');
            if (!startSel || !endSel) return;

            const currentStart = preserveStart !== null ? preserveStart : startSel.value;
            const currentEnd = preserveEnd !== null ? preserveEnd : endSel.value;

            buildSmartTimeOptions(startSel, { isEndTime: false });
            if (currentStart) startSel.value = currentStart;

            buildSmartTimeOptions(endSel, {
                isEndTime: true,
                startTimeValue: startSel.value
            });
            if (currentEnd) {
                const endOpt = Array.from(endSel.options).find(
                    o => o.value === currentEnd && !o.disabled
                );
                if (endOpt) endSel.value = currentEnd;
            }
        }

        function setupFixedGroupTimeEvents() {
            const startSel = document.getElementById('fg-start-time');
            const endSel = document.getElementById('fg-end-time');
            if (!startSel || !endSel) return;

            if (startSel.dataset.smartSetup === '1') return;
            startSel.dataset.smartSetup = '1';
            endSel.dataset.smartSetup = '1';

            startSel.addEventListener('change', function() {
                buildSmartTimeOptions(endSel, {
                    isEndTime: true,
                    startTimeValue: this.value
                });
            });
        }

        // ==========================================================
        // 💾 الحفظ والتوجيه
        // ==========================================================
        function getSelectedGender() {
            const el = document.querySelector('input[name="fg-gender"]:checked');
            return el ? el.value : 'مختلط';
        }

        function getSelectedLocation() {
            const el = document.querySelector('input[name="fg-location"]:checked');
            return el ? el.value : 'السنتر';
        }

        function captureFixedGroupData() {
            return {
                groupName: (document.getElementById('fg-group-name')?.value || '').trim(),
                centerName: (document.getElementById('fg-center-name')?.value || '').trim(),
                teacherName: (document.getElementById('fg-teacher-name')?.value || '').trim(),
                studentsCount: document.getElementById('fg-students-count')?.value || '20',
                startTime: document.getElementById('fg-start-time')?.value || '',
                endTime: document.getElementById('fg-end-time')?.value || '',
                genderAllowed: getSelectedGender(),
                location: getSelectedLocation()
            };
        }

        function fillFixedGroupData(data) {
            if (!data) data = {};
            document.getElementById('fg-group-name').value = data.groupName || '';
            document.getElementById('fg-center-name').value = data.centerName || '';
            document.getElementById('fg-teacher-name').value = data.teacherName || '';
            document.getElementById('fg-students-count').value = data.studentsCount || '20';

            const genderVal = data.genderAllowed || 'مختلط';
            const genderEl = document.querySelector(`input[name="fg-gender"][value="${genderVal}"]`);
            if (genderEl) genderEl.checked = true;

            const locVal = data.location || 'السنتر';
            const locEl = document.querySelector(`input[name="fg-location"][value="${locVal}"]`);
            if (locEl) locEl.checked = true;

            populateFixedGroupTimeSelects(data.startTime || null, data.endTime || null);
        }

        let autosaveTimer = null;

        function showAutosaveBar() {
            const bar = document.getElementById('autosave-bar');
            if (!bar) return;
            bar.classList.add('show');
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => bar.classList.remove('show'), 1200);
        }

        function autoSaveFixedGroupData() {
            try {
                localStorage.setItem('schedule_fixed_data', JSON.stringify(captureFixedGroupData()));
                showAutosaveBar();
            } catch(e) {}
        }

        window.saveFixedGroupData = function() {
            const fixedData = captureFixedGroupData();

            if (fixedData.startTime && fixedData.endTime) {
                const diff = calcMinutesDiffFG(fixedData.startTime, fixedData.endTime);
                if (diff <= 0) {
                    alert('⚠️ وقت النهاية يجب أن يكون بعد وقت البداية');
                    return;
                }
            }

            localStorage.setItem('schedule_fixed_data', JSON.stringify(fixedData));
            showAutosaveBar();
            console.log('✅ تم حفظ بيانات المجموعة:', fixedData);

            // توجيه المستخدم لصفحة index2 بعد 300 جزء من الثانية
            setTimeout(() => {
                window.location.href = 'index2.html';
            }, 300);
        };

        // ==========================================================
        // ✅ التهيئة
        // ==========================================================
        window.addEventListener('DOMContentLoaded', () => {
            populateFixedGroupTimeSelects();
            setupFixedGroupTimeEvents();

            try {
                const saved = localStorage.getItem('schedule_fixed_data');
                if (saved) fillFixedGroupData(JSON.parse(saved));
            } catch(e) {
                console.warn('فشل استرجاع البيانات:', e);
            }

            const fields = [
                'fg-group-name', 'fg-center-name', 'fg-teacher-name',
                'fg-students-count', 'fg-start-time', 'fg-end-time'
            ];
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', autoSaveFixedGroupData);
                    el.addEventListener('input', autoSaveFixedGroupData);
                }
            });

            document.querySelectorAll('input[name="fg-gender"], input[name="fg-location"]')
                .forEach(radio => {
                    radio.addEventListener('change', autoSaveFixedGroupData);
                });

            window.addEventListener('beforeunload', () => {
                try {
                    localStorage.setItem('schedule_fixed_data', JSON.stringify(captureFixedGroupData()));
                } catch(e) {}
            });
        });
    </script>

    <!-- 🔊 صوت ضغط رفيع -->
    <script>
    (function initClickSound() {
        let audioCtx = null;

        function getCtx() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        window.playClick = function(freq = 1800, duration = 0.035, volume = 0.08) {
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + duration);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.004);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;
            filter.Q.value = 0.7;
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        };

        function attachClickSound() {
            document.querySelectorAll('.save-btn, select, input, .cards-grid label').forEach(el => {
                if (el.dataset.soundAttached === '1') return;
                el.dataset.soundAttached = '1';
                el.addEventListener('click', () => {
                    if (el.disabled) return;
                    if (el.classList.contains('save-btn')) window.playClick(1400, 0.06, 0.13);
                    else window.playClick(1800, 0.035, 0.08);
                }, { passive: true });
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachClickSound);
        else attachClickSound();

        const observer = new MutationObserver(() => {
            clearTimeout(window._soundAttachTimer);
            window._soundAttachTimer = setTimeout(attachClickSound, 100);
        });
        observer.observe(document.body, { childList: true, subtree: true });

        document.addEventListener('touchstart', () => getCtx(), { once: true, passive: true });
        document.addEventListener('click', () => getCtx(), { once: true, passive: true });
    })();
    </script>
