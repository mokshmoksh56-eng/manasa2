<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ لوحة إدارة azemaa proo</title>
    <meta name="theme-color" content="#6e8efb">
    <style>
        :root {
            --bg-main: #000000;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%);
            --card-radius: 15px;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 12px;
            background: var(--bg-main); color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
        }

        /* ============ شاشة دخول الأدمن ============ */
        #login-overlay {
            position: fixed; inset: 0; background: #ffffff;
            z-index: 100000; display: flex;
            justify-content: center; align-items: center;
            padding: 20px; color: #0f172a;
        }
        .login-box {
            background: #fff; padding: 30px 25px;
            border-radius: var(--card-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid #e2e8f0;
        }
        .login-box h3 { margin: 0 0 8px; color: #1e293b; }
        .login-box p { font-size: 13px; color: #64748b; margin: 0 0 20px; }
        .login-box input {
            width: 100%; padding: 12px; margin: 6px 0;
            border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 16px; background: #f8fafc;
            direction: ltr; transition: border-color 0.2s;
        }
        .login-box input:focus { outline: none; border-color: #6e8efb; background: #fff; }
        .login-box input.error { border-color: var(--red); background: #fef2f2; }
        .login-box button {
            width: 100%; padding: 12px; background: #6e8efb;
            border: none; color: #fff; border-radius: 8px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .login-box button:disabled { opacity: 0.6; cursor: wait; }
        .error-msg {
            display: none; font-size: 12px; color: #dc2626;
            text-align: right; margin: 4px 0 6px;
            padding: 6px 10px; background: #fef2f2;
            border-radius: 6px; border-right: 3px solid #dc2626;
        }
        .error-msg.show { display: block; }

        /* ============ شريط تحذير ============ */
        .warning-banner {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
            color: #fecaca;
            line-height: 1.6;
        }
        .warning-banner strong { color: #fff; }

        /* ============ الهيدر ============ */
        header {
            background: var(--header-grad); color: #fff;
            padding: 15px 20px; border-radius: var(--card-radius);
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        header h1 { margin: 0; font-size: 18px; }
        .admin-info { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .admin-info button {
            background: rgba(255,255,255,0.25); border: none;
            color: #fff; padding: 8px 14px; border-radius: 8px;
            font-size: 12px; cursor: pointer; font-weight: bold;
        }

        /* ============ الإحصائيات ============ */
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 15px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: var(--card-radius);
            padding: 18px 12px; text-align: center;
            border: 2px solid #334155;
        }
        .stat-card.total { border-color: #6e8efb; }
        .stat-card.active { border-color: var(--green); }
        .stat-card.banned { border-color: var(--red); }
        .stat-number {
            font-size: 28px; font-weight: bold; margin-bottom: 4px;
        }
        .stat-card.total .stat-number { color: #6e8efb; }
        .stat-card.active .stat-number { color: var(--green); }
        .stat-card.banned .stat-number { color: var(--red); }
        .stat-label { font-size: 12px; color: #94a3b8; }

        /* ============ أدوات التحكم ============ */
        .controls {
            display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .controls input, .controls select, .controls button {
            padding: 11px 14px; border-radius: 10px;
            border: 2px solid #334155; background: var(--card-bg);
            color: var(--text-color); font-size: 14px; font-family: inherit;
        }
        .controls input { flex: 1; min-width: 180px; }
        .controls input:focus, .controls select:focus { outline: none; border-color: #6e8efb; }
        .controls button {
            cursor: pointer; font-weight: bold;
            background: #6e8efb; border-color: #6e8efb;
        }

        /* ============ قائمة المستخدمين ============ */
        #users-list { display: flex; flex-direction: column; gap: 10px; }

        .user-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            padding: 16px;
            border: 2px solid #334155;
            display: flex; flex-direction: column; gap: 12px;
            transition: border-color 0.2s;
        }
        .user-card.banned { border-color: var(--red); background: #3f1d1d; }

        .user-info { display: flex; flex-direction: column; gap: 8px; }
        .user-email {
            font-size: 15px; font-weight: bold;
            word-break: break-all; direction: ltr; text-align: right;
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }
        .user-email .status-badge {
            font-size: 10px; padding: 3px 8px; border-radius: 20px;
            font-weight: bold; white-space: nowrap;
        }
        .status-badge.active { background: rgba(16,185,129,0.2); color: var(--green); }
        .status-badge.banned { background: rgba(239,68,68,0.2); color: var(--red); }

        .user-meta {
            font-size: 12px; color: #94a3b8;
            display: flex; gap: 15px; flex-wrap: wrap;
        }
        .user-meta span { display: flex; align-items: center; gap: 4px; }

        /* ============ عداد أيام التسجيل ============ */
        .user-counter {
            font-size: 13px;
            color: #c7d2fe;
            background: rgba(110,142,251,0.12);
            border: 1px solid rgba(110,142,251,0.35);
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
        }
        .user-counter strong {
            color: #6e8efb;
            font-size: 16px;
            font-weight: bold;
        }

        .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .user-actions button {
            flex: 1; min-width: 100px;
            padding: 10px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: bold; cursor: pointer;
            transition: opacity 0.2s;
        }
        .user-actions button:disabled { opacity: 0.5; cursor: wait; }
        .btn-ban { background: var(--red); color: #fff; }
        .btn-unban { background: var(--green); color: #fff; }
        .btn-delete { background: #7c3aed; color: #fff; }
        .btn-copy { background: #334155; color: #fff; }

        .empty-state {
            text-align: center; padding: 40px 20px;
            color: #64748b; font-size: 14px;
        }

        .loading {
            text-align: center; padding: 30px;
            color: #64748b;
        }
        .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid #334155; border-top-color: #6e8efb;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 550px) {
            header h1 { font-size: 15px; }
            .stat-number { font-size: 22px; }
            .stat-label { font-size: 11px; }
            .user-email { font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- ============ شاشة دخول الأدمن ============ -->
<div id="login-overlay">
    <div class="login-box">
        <h3>🛡️ لوحة الإدارة</h3>
        <p>خاص بالمشرفين فقط</p>

        <input type="email" id="admin-email" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
        <div class="error-msg" id="admin-email-error"></div>

        <input type="password" id="admin-password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
        <div class="error-msg" id="admin-password-error"></div>

        <button id="admin-login-btn">🔐 دخول</button>
    </div>
</div>

<!-- ============ لوحة الإدارة ============ -->
<div id="dashboard" style="display: none;">

    <!-- شريط تحذير -->
    <div class="warning-banner">
        ⚠️ <strong>تنبيه:</strong> هذه اللوحة تحتوي بيانات حساسة. لا تشارك رابطها مع أي شخص.
    </div>

    <!-- الهيدر -->
    <header>
        <h1>🛡️ لوحة إدارة azemaa proo</h1>
        <div class="admin-info">
            <span id="admin-email-display"></span>
            <button id="admin-logout">خروج 🚪</button>
        </div>
    </header>

    <!-- الإحصائيات -->
    <div class="stats">
        <div class="stat-card total">
            <div class="stat-number" id="total-count">0</div>
            <div class="stat-label">إجمالي المستخدمين</div>
        </div>
        <div class="stat-card active">
            <div class="stat-number" id="active-count">0</div>
            <div class="stat-label">نشط</div>
        </div>
        <div class="stat-card banned">
            <div class="stat-number" id="banned-count">0</div>
            <div class="stat-label">محظور</div>
        </div>
    </div>

    <!-- أدوات التحكم -->
    <div class="controls">
        <input type="text" id="search-input" placeholder="🔍 ابحث بالبريد الإلكتروني...">
        <select id="filter-select">
            <option value="all">الكل</option>
            <option value="active">النشطين فقط</option>
            <option value="banned">المحظورين فقط</option>
        </select>
        <button id="refresh-btn">🔄 تحديث</button>
    </div>

    <!-- قائمة المستخدمين -->
    <div id="users-list">
        <div class="loading">
            <div class="spinner"></div>
            <div>جاري تحميل البيانات...</div>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ==================== إعدادات Firebase ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    // ==================== بيانات الأدمن ====================
    const ADMIN_EMAIL = 'mokshmoksh56@gmail.com';
    const ADMIN_PASSWORD = '436643';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ==================== عناصر DOM ====================
    const loginOverlay = document.getElementById('login-overlay');
    const dashboard = document.getElementById('dashboard');
    const adminEmailDisplay = document.getElementById('admin-email-display');
    const usersList = document.getElementById('users-list');
    const searchInput = document.getElementById('search-input');
    const filterSelect = document.getElementById('filter-select');
    const refreshBtn = document.getElementById('refresh-btn');

    // ==================== متغيرات ====================
    let allUsers = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let unsubscribeUsers = null;

    // ==================== دوال مساعدة ====================

    function showError(inputId, errorId, msg) {
        const input = document.getElementById(inputId);
        const err = document.getElementById(errorId);
        input.classList.add('error');
        err.innerText = msg;
        err.classList.add('show');
    }

    function clearError(inputId, errorId) {
        const input = document.getElementById(inputId);
        const err = document.getElementById(errorId);
        input.classList.remove('error');
        err.classList.remove('show');
        err.innerText = '';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            const d = new Date(dateStr);
            return d.toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch (e) { return dateStr; }
    }

    function daysAgo(dateStr) {
        if (!dateStr) return '';
        try {
            const diff = Date.now() - new Date(dateStr).getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days === 0) return 'اليوم';
            if (days === 1) return 'منذ يوم';
            if (days < 30) return `منذ ${days} يوم`;
            const months = Math.floor(days / 30);
            if (months === 1) return 'منذ شهر';
            if (months < 12) return `منذ ${months} شهر`;
            const years = Math.floor(months / 12);
            return years === 1 ? 'منذ سنة' : `منذ ${years} سنوات`;
        } catch (e) { return ''; }
    }

    // ==================== ⏱️ عداد أيام التسجيل ====================

    function getDaysElapsed(createdAt) {
        if (!createdAt) return null;

        let start = createdAt;
        // دعم Unix timestamp بالثواني أو بالميلي ثانية
        if (typeof start === 'number' && start < 1e12) start = start * 1000;

        const startMs = new Date(start).getTime();
        if (isNaN(startMs)) return null;

        let diff = Date.now() - startMs;
        if (diff < 0) diff = 0;

        return Math.floor(diff / 86400000); // 1000*60*60*24
    }

    function updateCounters() {
        document.querySelectorAll('.user-counter').forEach(el => {
            const days = getDaysElapsed(el.dataset.created);
            el.querySelector('strong').textContent = (days === null) ? '—' : days;
        });
    }

    // تحديث العداد تلقائياً كل دقيقة (يكفي لأنه بالأيام)
    setInterval(updateCounters, 60000);

    // ==================== التحقق من تسجيل الدخول ====================

    function isLoggedIn() {
        return localStorage.getItem('admin_logged_in') === 'true';
    }

    function setLoggedIn() {
        localStorage.setItem('admin_logged_in', 'true');
        localStorage.setItem('admin_email', ADMIN_EMAIL);
    }

    function setLoggedOut() {
        localStorage.removeItem('admin_logged_in');
        localStorage.removeItem('admin_email');
    }

    // ==================== دخول الأدمن ====================

    document.getElementById('admin-login-btn').addEventListener('click', () => {
        const emailInput = document.getElementById('admin-email');
        const passInput = document.getElementById('admin-password');
        const btn = document.getElementById('admin-login-btn');
        const email = emailInput.value.trim().toLowerCase();
        const password = passInput.value;

        clearError('admin-email', 'admin-email-error');
        clearError('admin-password', 'admin-password-error');

        if (!email) {
            showError('admin-email', 'admin-email-error', '⚠️ يرجى إدخال البريد الإلكتروني');
            emailInput.focus();
            return;
        }

        if (!password) {
            showError('admin-password', 'admin-password-error', '⚠️ يرجى إدخال كلمة المرور');
            passInput.focus();
            return;
        }

        // التحقق من بيانات الأدمن
        if (email !== ADMIN_EMAIL.toLowerCase() || password !== ADMIN_PASSWORD) {
            showError('admin-password', 'admin-password-error', '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة');
            passInput.value = '';
            passInput.focus();
            return;
        }

        // دخول ناجح
        btn.innerText = "⏳ جاري الدخول...";
        btn.disabled = true;
        setLoggedIn();

        setTimeout(() => {
            loginOverlay.style.display = 'none';
            dashboard.style.display = 'block';
            adminEmailDisplay.innerText = '👤 ' + ADMIN_EMAIL;
            loadUsers();
            btn.innerText = "🔐 دخول";
            btn.disabled = false;
        }, 400);
    });

    // تسجيل دخول تلقائي لو موجود في localStorage
    if (isLoggedIn()) {
        loginOverlay.style.display = 'none';
        dashboard.style.display = 'block';
        adminEmailDisplay.innerText = '👤 ' + ADMIN_EMAIL;
        loadUsers();
    }

    // ==================== تحميل المستخدمين ====================

    function loadUsers() {
        if (unsubscribeUsers) unsubscribeUsers();

        usersList.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري تحميل البيانات...</div>
            </div>
        `;

        const usersRef = ref(db, 'users');
        unsubscribeUsers = onValue(usersRef, (snapshot) => {
            allUsers = [];
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    allUsers.push({
                        uid: child.key,
                        email: data.email || '—',
                        createdAt: data.createdAt || null,
                        banned: data.banned === true,
                        bannedAt: data.bannedAt || null,
                        bannedBy: data.bannedBy || null,
                        role: data.role || 'client'
                    });
                });
                allUsers.sort((a, b) => {
                    if (!a.createdAt) return 1;
                    if (!b.createdAt) return -1;
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });
            }
            updateStats();
            renderUsers();
        }, (error) => {
            console.error(error);
            usersList.innerHTML = `
                <div class="empty-state">
                    ❌ تعذر تحميل البيانات<br>
                    <small>${error.message}</small><br><br>
                    <small>تأكد من أن Firebase Rules تسمح بالقراءة:</small><br>
                    <code style="display:block;background:#0f172a;padding:10px;border-radius:6px;margin-top:8px;direction:ltr;text-align:left;font-size:11px;">{ "rules": { "users": { ".read": true, ".write": true } } }</code>
                </div>
            `;
        });
    }

    // ==================== تحديث الإحصائيات ====================

    function updateStats() {
        const total = allUsers.length;
        const banned = allUsers.filter(u => u.banned).length;
        const active = total - banned;

        document.getElementById('total-count').innerText = total;
        document.getElementById('active-count').innerText = active;
        document.getElementById('banned-count').innerText = banned;
    }

    // ==================== عرض المستخدمين ====================

    function renderUsers() {
        let filtered = allUsers;
        if (currentFilter === 'active') filtered = filtered.filter(u => !u.banned);
        else if (currentFilter === 'banned') filtered = filtered.filter(u => u.banned);

        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            filtered = filtered.filter(u => u.email.toLowerCase().includes(q));
        }

        if (filtered.length === 0) {
            usersList.innerHTML = `
                <div class="empty-state">
                    ${allUsers.length === 0 
                        ? '📭 لا يوجد مستخدمون مسجلون بعد' 
                        : '🔍 لا يوجد مستخدمون مطابقون للبحث'}
                </div>
            `;
            return;
        }

        usersList.innerHTML = filtered.map(user => `
            <div class="user-card ${user.banned ? 'banned' : ''}">
                <div class="user-info">
                    <div class="user-email">
                        <span>${user.email}</span>
                        <span class="status-badge ${user.banned ? 'banned' : 'active'}">
                            ${user.banned ? '🚫 محظور' : '✅ نشط'}
                        </span>
                    </div>
                    <div class="user-meta">
                        <span>📅 ${formatDate(user.createdAt)}</span>
                        ${user.createdAt ? `<span>(${daysAgo(user.createdAt)})</span>` : ''}
                    </div>

                    <!-- ⏱️ عداد أيام التسجيل -->
                    <div class="user-counter" data-created="${user.createdAt || ''}">
                        ⏱️ مسجل من: <strong>—</strong> يوم
                    </div>

                    ${user.banned && user.bannedAt ? `
                        <div class="user-meta" style="color:#ef4444;">
                            <span>🚫 حُظر في ${formatDate(user.bannedAt)}</span>
                        </div>
                    ` : ''}
                </div>
                <div class="user-actions">
                    <button class="btn-copy" onclick="copyEmail('${user.email.replace(/'/g, "\\'")}')">📋 نسخ</button>
                    ${user.banned 
                        ? `<button class="btn-unban" onclick="toggleBan('${user.uid}', false)">✅ إلغاء الحظر</button>`
                        : `<button class="btn-ban" onclick="toggleBan('${user.uid}', true)">🚫 حظر</button>`
                    }
                    <button class="btn-delete" onclick="deleteUser('${user.uid}', '${user.email.replace(/'/g, "\\'")}')">🗑️ حذف</button>
                </div>
            </div>
        `).join('');

        // تشغيل العداد أول مرة بعد الرسم
        updateCounters();
    }

    // ==================== حظر / إلغاء حظر ====================

    window.toggleBan = async function(uid, shouldBan) {
        const user = allUsers.find(u => u.uid === uid);
        if (!user) return;

        const action = shouldBan ? 'حظر' : 'إلغاء حظر';
        const confirmMsg = shouldBan 
            ? `🚫 هل تريد حظر المستخدم؟\n\n${user.email}\n\nلن يستطيع الدخول للنظام حتى تلغي الحظر.`
            : `✅ هل تريد إلغاء حظر المستخدم؟\n\n${user.email}\n\nسيستطيع الدخول للنظام مرة أخرى.`;

        if (!confirm(confirmMsg)) return;

        try {
            const updates = { banned: shouldBan };
            if (shouldBan) {
                updates.bannedAt = new Date().toISOString();
                updates.bannedBy = ADMIN_EMAIL;
            } else {
                updates.bannedAt = null;
                updates.bannedBy = null;
            }
            await update(ref(db, 'users/' + uid), updates);
        } catch (error) {
            alert('❌ فشل ' + action + ':\n' + error.message);
        }
    };

    // ==================== حذف مستخدم ====================

    window.deleteUser = async function(uid, email) {
        const firstConfirm = confirm(
            `🗑️ حذف بيانات المستخدم نهائياً؟\n\n${email}\n\n` +
            `⚠️ هذا يحذف بياناته من قاعدة البيانات.\n` +
            `ملاحظة: حسابه في Firebase Auth يبقى موجوداً.\n` +
            `(لحذفه من Auth استخدم Firebase Console)`
        );
        if (!firstConfirm) return;

        const finalConfirm = confirm(
            `🚨 تأكيد نهائي!\n\nهل تريد فعلاً حذف بيانات ${email}؟`
        );
        if (!finalConfirm) return;

        try {
            await remove(ref(db, 'users/' + uid));
        } catch (error) {
            alert('❌ فشل الحذف:\n' + error.message);
        }
    };

    // ==================== نسخ الإيميل ====================

    window.copyEmail = function(email) {
        navigator.clipboard.writeText(email).then(() => {
            const toast = document.createElement('div');
            toast.innerText = '✅ تم النسخ';
            toast.style.cssText = `
                position: fixed; bottom: 20px; left: 50%;
                transform: translateX(-50%);
                background: #10b981; color: #fff;
                padding: 10px 20px; border-radius: 10px;
                font-weight: bold; z-index: 99999;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        });
    };

    // ==================== البحث والفلترة ====================

    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        renderUsers();
    });

    filterSelect.addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderUsers();
    });

    refreshBtn.addEventListener('click', () => {
        loadUsers();
    });

    // ==================== تسجيل خروج الأدمن ====================

    document.getElementById('admin-logout').addEventListener('click', () => {
        if (!confirm('هل تريد تسجيل الخروج من لوحة الإدارة؟')) return;
        setLoggedOut();
        if (unsubscribeUsers) { unsubscribeUsers(); unsubscribeUsers = null; }
        dashboard.style.display = 'none';
        loginOverlay.style.display = 'flex';
        document.getElementById('admin-email').value = '';
        document.getElementById('admin-password').value = '';
    });

</script>
</body>
</html>
